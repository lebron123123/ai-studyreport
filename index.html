<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="ppt-asset-center.css?v=1.0">
<link rel="stylesheet" href="ppt-guided-flow-v2.css?v=1.4">
<link rel="stylesheet" href="ppt-guided-flow-v2-layout-fix.css?v=1.0">
<style>
  :root{
    /* 蓝图·公文 配色体系 */
    --bp-deep:#1E4B72;        /* 侧栏深蓝底（提亮，不再死黑） */
    --bp-navy:#2C6CA6;        /* 主蓝（与后台一致的清爽蓝） */
    --bp-line:#37659A;        /* 蓝图网格线（相应提亮） */
    --bp-cyan:#7FB3C8;        /* 绘图青（侧栏强调/眉标） */
    --paper:#F7FAFD;          /* 环境色（浅蓝白，与后台一致） */
    --paper-card:#FFFFFF;     /* 卡片纸面（纯白） */
    --ink:#1C2733;            /* 正文墨色 */
    --ink-soft:#66788C;       /* 次级文字 */
    --line:#DCE6F0;           /* 浅蓝细线（与后台一致） */
    --line-strong:#C3D2E2;
    --seal-red:#C24A42;       /* 印章朱砂（略柔和） */
    --seal-red-dim:#C24A4255;
    --ok-green:#3E7A53;
    --blueprint:var(--bp-navy);       /* 兼容旧变量名 */
    --blueprint-dim:#4A7AB0;
    --mono:"SF Mono","Cascadia Mono","Consolas","Courier New",monospace;
    --serif:"Songti SC","STSong","SimSun","Noto Serif SC",serif;
    --sans:"PingFang SC","MiSans","Microsoft YaHei","Hiragino Sans GB",sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0; padding:0;}
  body{
    background:var(--paper);
    color:var(--ink); font-family:var(--sans); -webkit-font-smoothing:antialiased;
  }

  .app{display:flex; min-height:100vh;}

  /* ============ 左侧：蓝图面板 ============ */
  .toc{
    width:230px; flex-shrink:0; background:var(--side-bg,#EEF4FA);
    border-right:1px solid var(--side-line,#DCE6F2);
    padding:22px 14px; position:sticky; top:0; height:100vh; overflow-y:auto;
  }
  .toc-title{
    font-family:var(--serif); font-size:16px; font-weight:700; color:var(--bp-deep);
    padding:2px 10px 20px;
  }
  .toc-title::after{
    content:"FEASIBILITY STUDIO"; display:block; margin-top:3px;
    font-family:var(--mono); font-size:9.5px; letter-spacing:2px; color:var(--ink-soft);
  }
  #tocList{margin-top:4px;}
  .toc-item{
    display:flex; gap:10px; align-items:center; padding:10px 12px; margin-bottom:2px;
    font-size:13.5px; color:var(--ink); border-radius:8px; position:relative; transition:background .15s ease;
  }
  .toc-item:hover{background:var(--side-hover,#E4EDF6);}
  .toc-item .num{
    font-family:var(--mono); font-size:10px; flex-shrink:0;
    width:22px; height:22px; line-height:20px; text-align:center;
    border:1px solid var(--line-strong); border-radius:50%;
    color:var(--bp-navy); background:#fff; transition:all .2s ease;
  }
  .toc-item.active{background:#FFFFFF; font-weight:600; color:var(--bp-deep); box-shadow:0 1px 3px rgba(30,75,114,.12);}
  .toc-item.active .num{background:var(--bp-navy); color:#fff; border-color:var(--bp-navy);}
  .toc-item.done{color:var(--ink-soft);}
  .toc-item.done .num{border-color:var(--bp-navy); color:#fff; background:var(--bp-navy); opacity:.55;}

  /* ============ 右侧：文档纸面 ============ */
  .sheet-wrap{flex:1; padding:44px 48px; min-width:0;}
  .sheet{
    background:var(--paper-card); max-width:860px; margin:0 auto;
    border:1px solid var(--line);
    box-shadow:0 1px 2px rgba(30,75,114,.05);
    padding:36px 44px 46px; position:relative; min-height:600px;
    border-radius:10px;
  }

  /* 页面切换时的内容浮现 */
  .sheet > *{animation:riseIn .38s cubic-bezier(.22,.8,.36,1) both;}
  .sheet > *:nth-child(2){animation-delay:.04s;}
  .sheet > *:nth-child(3){animation-delay:.08s;}
  .sheet > *:nth-child(4){animation-delay:.12s;}
  @keyframes riseIn{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:none;}}
  @media (prefers-reduced-motion: reduce){
    .sheet > *{animation:none;}
    *{transition:none !important;}
  }

  .doc-eyebrow{
    font-family:var(--mono); font-size:10.5px; letter-spacing:2.4px; color:var(--bp-navy);
    text-transform:uppercase; margin-bottom:10px; display:flex; align-items:center; gap:10px;
  }
  .doc-eyebrow::before{content:""; width:26px; height:1px; background:var(--seal-red);}
  h1.doc-title{
    font-family:var(--serif); font-size:24px; margin:0 0 10px; color:var(--bp-deep); font-weight:700;
    letter-spacing:.3px; padding-bottom:12px; border-bottom:1px solid var(--line);
  }
  .step-desc{font-size:13px; color:var(--ink-soft); margin:16px 0 22px; line-height:1.75; max-width:64ch;}
  .housing-hero{
    position:relative;height:360px;margin:22px 0 2px;overflow:hidden;
    border:1px solid #D7E7F2;border-radius:10px;
    background:linear-gradient(180deg,#FBFDFF 0%,#F5FAFD 62%,#EDF6FB 100%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.9);
  }
  .housing-hero::before{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(rgba(121,177,210,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(121,177,210,.055) 1px,transparent 1px);
    background-size:24px 24px;mask-image:linear-gradient(to bottom,transparent 4%,#000 58%,#000 100%);
  }
  .housing-hero::after{
    content:"";position:absolute;inset:-18% -6%;pointer-events:none;opacity:.58;
    background:radial-gradient(ellipse at 83% 4%,transparent 0 39%,rgba(176,215,237,.20) 39.3% 47%,transparent 47.4%),radial-gradient(ellipse at 88% 8%,transparent 0 52%,rgba(202,228,242,.22) 52.3% 59%,transparent 59.4%);
  }
  .housing-hero canvas{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none;}
  .housing-hero-head{position:absolute;z-index:3;left:28px;right:28px;top:22px;display:flex;align-items:flex-start;justify-content:space-between;gap:20px;pointer-events:none;}
  .housing-hero-copy{display:flex;flex-direction:column;min-width:0;}
  .housing-hero-copy span{font-family:var(--mono);font-size:9px;letter-spacing:2px;color:#7CAAC6;}
  .housing-hero-copy b{font-family:var(--serif);font-size:17px;letter-spacing:.5px;color:#315F7D;margin-top:7px;font-weight:600;}
  .housing-hero-copy small{font-size:10.5px;color:#88A7BB;margin-top:6px;letter-spacing:1px;}
  .housing-brand{display:flex;align-items:center;gap:8px;flex:0 0 auto;padding-top:1px;color:#287CA9;}
  .housing-brand svg{width:37px;height:34px;display:block;filter:drop-shadow(0 2px 3px rgba(35,124,170,.10));}
  .housing-brand>div{display:flex;flex-direction:column;line-height:1;}
  .housing-brand>div b{font-family:"Microsoft YaHei","PingFang SC",sans-serif;font-size:20px;font-weight:800;letter-spacing:2px;color:#327FA7;white-space:nowrap;}
  .housing-brand>div span{font-family:Arial,sans-serif;font-size:5.8px;font-weight:700;letter-spacing:.15px;color:#609AB8;margin-top:4px;white-space:nowrap;}
  .housing-hero-axis{position:absolute;z-index:2;left:28px;right:28px;bottom:13px;display:flex;align-items:center;gap:8px;color:#86A8BC;font-size:9px;letter-spacing:.7px;pointer-events:none;}
  .housing-hero-axis i{display:block;width:5px;height:5px;border:1px solid #78AFD0;border-radius:50%;background:#F7FBFE;}
  .housing-hero-axis span:not(:last-child)::after{content:"";display:inline-block;width:30px;height:1px;margin:0 0 3px 8px;background:#C4DFEE;}
  @media(max-width:820px){.housing-hero{height:300px}.housing-hero-head{left:20px;right:20px;top:18px}.housing-hero-copy b{font-size:15px}.housing-brand svg{width:30px;height:28px}.housing-brand>div b{font-size:16px}.housing-brand>div span{font-size:4.7px}.housing-hero-axis{left:20px;right:20px}.housing-hero-axis span:not(:last-child)::after{width:10px}}
  @media(max-width:560px){.housing-brand>div{display:none}.housing-brand svg{width:34px;height:31px}.housing-hero-copy small{letter-spacing:.3px}}
  @media(prefers-reduced-motion:reduce){.housing-hero canvas{opacity:.82}}

  label{display:block; font-size:12px; color:var(--ink-soft); margin:16px 0 6px; letter-spacing:.3px;}
  input[type=text],input[type=number],select,textarea{
    width:100%; font-family:var(--sans); font-size:14px; color:var(--ink);
    background:#FFFFFF; border:1px solid var(--line); border-radius:6px;
    padding:10px 12px; outline:none;
    transition:border-color .18s ease, box-shadow .18s ease;
  }
  input:focus,select:focus,textarea:focus{
    border-color:var(--bp-navy);
    box-shadow:0 0 0 3px rgba(30,58,92,.12);
  }
  textarea{min-height:80px; resize:vertical;}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:0 22px;}
  .is-editor{grid-column:1/-1;margin-top:18px;border:1px solid var(--line);border-radius:10px;background:#fff;overflow:hidden}
  .is-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:16px 18px;background:#f7f9fb;border-bottom:1px solid var(--line)}
  .is-head b{font-size:15px;color:var(--bp)}.is-head>div>div{font-size:12px;color:var(--ink-soft);margin-top:4px}.is-tools{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
  .is-gantt-scroll,.is-plan-scroll{overflow-x:auto;padding:14px 18px 4px}.is-gantt,.is-plan{border-collapse:collapse;min-width:max-content;width:100%;font-size:11px}
  .is-gantt th,.is-gantt td,.is-plan th,.is-plan td{border:1px solid #cbd5df;text-align:center;padding:0}.is-gantt th{background:#eef3f7;padding:7px 5px;min-width:52px}.is-gantt th:first-child{position:sticky;left:0;z-index:2;min-width:132px;text-align:left;padding-left:9px;background:#eef3f7}
  .is-gantt td{width:52px;height:29px}.is-qcell{display:block;width:100%;height:29px;border:0;border-radius:0;background:#fff;cursor:crosshair;padding:0}.is-qcell:hover{box-shadow:inset 0 0 0 2px var(--bp)}.is-qcell.active{background:var(--is-color)}
  .is-plan th,.is-plan td{padding:7px 8px;min-width:72px}.is-plan th{background:#f1f5f8}.is-annual{display:flex;gap:8px;flex-wrap:wrap;padding:10px 18px}.is-annual span{border:1px solid var(--line);border-radius:6px;padding:7px 10px;font-size:11.5px;background:#fafcfd}
  .is-empty,.is-errors,.is-ok{margin:10px 18px 16px;padding:9px 11px;border-radius:6px;font-size:12px}.is-empty{color:var(--ink-soft);background:#f7f9fb}.is-errors{color:#8b3a2d;background:#fff3f1}.is-ok{color:#27734a;background:#eef8f2}
  .is-sale-coeff{margin:18px;border:1px solid var(--line);border-radius:8px;overflow:hidden}.is-sale-coeff-head{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 14px;background:#f2f7f8}.is-sale-coeff-head b{color:#006b70}.is-sale-coeff-head>div>div{font-size:11.5px;color:var(--ink-soft);margin-top:3px}.is-sale-coeff-head span{font-size:11px;padding:4px 8px;border-radius:99px}.is-sale-coeff-head .ok{color:#27734a;background:#e8f6ed}.is-sale-coeff-head .err{color:#8b3a2d;background:#fff0ed}.is-sale-coeff .is-plan-scroll{padding:0}.is-sale-coeff .is-plan th:first-child{min-width:58px}.is-sale-coeff .is-plan th:nth-child(2){min-width:210px}.is-sale-coeff .is-subrow th{padding-left:24px;font-weight:500}.is-sale-coeff td.has-value{background:#e8ecef;font-weight:600;color:#334a5a}

  .btn{
    font-family:var(--sans); font-size:13.5px; font-weight:600; padding:11px 24px;
    border:1px solid var(--bp-navy); border-radius:7px;
    background:var(--bp-navy); color:#fff; cursor:pointer; letter-spacing:.5px;
    transition:filter .12s ease;
  }
  .btn:hover{filter:brightness(1.08);}
  .btn:focus-visible{outline:2px solid var(--bp-cyan); outline-offset:2px;}
  .btn.ghost{background:transparent; color:var(--bp-navy);}
  .btn.ghost:hover{background:var(--line-soft,#EAF1F8);}
  .btn:disabled{background:var(--line); border-color:var(--line); color:#98937F; cursor:not-allowed;}
  .actions{margin-top:34px; display:flex; gap:12px; justify-content:flex-end; flex-wrap:wrap;}

  .note-box{
    margin-top:24px; background:#F3F0E6;
    border:1px solid var(--line); border-top:2px solid var(--bp-navy);
    padding:13px 18px; font-size:12.5px; color:var(--ink-soft); line-height:1.7; border-radius:2px;
  }

  /* ============ AI可研生成（对话式）============ */
  /* 报告预览面板只在真正开始生成时才出现（.air-shell 不带 .solo），
     此时才需要把 #sheet 的860px正文宽度让开；采集/确认阶段还没有可预览的内容，
     维持全站统一的860px单栏宽度，不会一开始就显得又窄又挤 */
  #sheet:has(.air-shell:not(.solo)){ max-width:min(1580px,calc(100vw - 112px)); }
  .sheet-wrap:has(#sheet .air-shell:not(.solo)){ padding-left:8px; padding-right:8px; }
  #sheet:has(.air-shell:not(.solo)){ padding-left:22px; padding-right:22px; }

  .air-restart-row{ display:flex; justify-content:flex-start; margin-bottom:8px; }
  .air-restart-btn{
    padding:5px 13px; font-size:12px; border-radius:14px;
    border:1px solid var(--line-strong); color:var(--ink-soft); background:#fff;
  }
  .air-restart-btn:hover{ border-color:var(--seal-red,#C24A42); color:var(--seal-red,#C24A42); background:#FBEAEA; }

  .air-card{
    margin-top:6px; background:#FAFBFC; border:1px solid var(--line,#DCE6F0);
    border-radius:8px; padding:14px 16px;
  }
  .air-conf{
    display:inline-block; padding:1px 9px; border-radius:10px; font-size:11px; font-weight:600;
  }
  .air-conf-hi{ background:#E7F3EA; color:#2E7D46; }
  .air-conf-mid{ background:#FDF3DE; color:#A6740F; }
  .air-conf-lo{ background:#FBEAEA; color:var(--seal-red,#C24A42); }

  /* ---- 分栏：左聊天 / 右报告预览（只在生成开始后出现） ---- */
  .air-shell{ display:grid; grid-template-columns:minmax(0,.92fr) minmax(0,1.08fr); gap:18px; align-items:flex-start; margin-top:16px; }
  .air-chat-pane{ min-width:0; display:flex; flex-direction:column; }
  /* .solo：还没开始生成，或者用户手动收起了预览——聊天区独占整行，不挤 */
  .air-shell.solo{ display:block; }
  .air-shell.solo .air-doc-pane{ display:none; }
  .air-doc-toggle{ margin:10px 0 2px; }
  .air-doc-reopen{
    font-size:12px; padding:6px 14px; border-radius:16px; border:1px solid var(--line-strong);
    background:#fff; color:var(--bp-navy); cursor:pointer; transition:all .15s ease;
  }
  .air-doc-reopen:hover{ background:var(--line-soft,#EAF1F8); border-color:var(--bp-navy); }
  .air-doc-pane{
    min-width:0; position:sticky; top:20px;
    max-height:calc(100vh - 40px); display:flex; flex-direction:column;
    border:1px solid var(--line); border-radius:10px; background:var(--paper-card,#fff);
    box-shadow:0 1px 2px rgba(30,75,114,.05); overflow:hidden;
  }
  .air-doc-pane.empty{ align-items:center; justify-content:center; padding:40px 30px; text-align:center; }
  .air-doc-empty-tip{ font-size:12.5px; color:var(--ink-soft); line-height:1.8; max-width:34ch; }
  .air-doc-empty-tip .ic{ font-size:26px; display:block; margin-bottom:10px; opacity:.6; }
  .air-doc-head{
    padding:14px 18px 12px; border-bottom:1px solid var(--line); flex-shrink:0; position:relative;
  }
  .air-doc-close{
    position:absolute; top:10px; right:12px; border:none; background:transparent; cursor:pointer;
    font-size:15px; color:var(--ink-faint,#8A97A8); line-height:1; padding:4px 7px; border-radius:5px;
    transition:all .15s ease;
  }
  .air-doc-close:hover{ background:var(--line-soft,#EAF1F8); color:var(--seal-red,#C24A42); }
  .air-doc-title{ font-family:var(--serif); font-size:16px; font-weight:700; color:var(--ink); }
  .air-doc-meta{ font-family:var(--mono); font-size:10.5px; color:var(--ink-soft); margin-top:4px; letter-spacing:.3px; }
  .air-doc-outline{
    display:flex; gap:6px; flex-wrap:wrap; padding:10px 18px; border-bottom:1px solid var(--line);
    flex-shrink:0; max-height:88px; overflow-y:auto;
  }
  .air-doc-outline .chip{
    font-size:11px; padding:3px 9px; border-radius:11px; border:1px solid var(--line-strong);
    color:var(--ink-soft); cursor:pointer; white-space:nowrap; transition:all .15s ease; background:#fff;
  }
  .air-doc-outline .chip:hover{ border-color:var(--bp-navy); color:var(--bp-navy); }
  .air-doc-outline .chip.state-gen{ border-color:var(--bp-navy); color:var(--bp-navy); background:#EAF1F8; }
  .air-doc-outline .chip.state-done{ border-color:#BFE0C9; color:#2E7D46; background:#EDF7EF; }
  .air-doc-outline .chip.state-failed{ border-color:var(--seal-red-dim,#C24A4255); color:var(--seal-red,#C24A42); background:#FBEAEA; }
  .air-material-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:1px}.air-material-dot.ok{background:#31915A}.air-material-dot.pending{background:#D89B32;box-shadow:0 0 0 2px #FFF0CF}.air-material-dot.missing{background:#D84E45;box-shadow:0 0 0 2px #FBE3E1}
  .air-doc-scroll{ flex:1; overflow-y:auto; padding:16px 20px 26px; }
  .air-doc-scroll .chapter-block{ margin-bottom:26px; }
  .air-doc-scroll .chapter-block:last-child{ margin-bottom:4px; }
  .air-section-material{margin:8px 0 11px;padding:9px 11px;border-radius:7px;display:flex;flex-direction:column;gap:4px;font-size:11px;line-height:1.6}
  .air-section-material.ok{background:#EDF8F1;border:1px solid #B7DDC6;color:#256841}
  .air-section-material.pending{position:relative;background:#FFF8E8;border:1px solid #E6C780;color:#8A621A;padding-left:22px}
  .air-section-material.pending::before{content:"◇";position:absolute;left:8px;top:9px;color:#B47A16;font-weight:700}
  .air-section-material.missing{position:relative;background:#FFF0EF;border:1px solid #E6A5A0;color:#A83E38;padding-left:22px}
  .air-section-material.missing::before{content:"➜";position:absolute;left:7px;top:9px;color:var(--red,#C24A42);font-weight:700}
  .air-section-material span{color:inherit;opacity:.85}
  .air-section-material-actions{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:4px}
  .air-material-upload{margin-top:4px;align-self:flex-start;border:1px solid currentColor;border-radius:13px;background:#fff;color:var(--red,#C24A42);padding:3px 9px;font-size:10.5px;cursor:pointer}
  .air-material-upload:hover{background:#FBE3E1}
  .air-logic-enhance{display:inline-flex;align-items:center;margin:0;border:1px solid #6f96bd;border-radius:13px;background:#f3f8fd;color:#245b8f;padding:3px 9px;font-size:10.5px;cursor:pointer}
  .air-logic-enhance:hover{background:#e7f1fb}.air-batch-material-upload{box-shadow:0 4px 12px rgba(36,91,143,.14)}
  .air-enhance-entry-tip{display:flex;align-items:center;gap:12px;margin:-2px 0 10px;padding:9px 12px;border:1px solid #b9d6ef;border-radius:8px;background:#f1f7fd;color:#245b8f;font-size:11.5px}.air-enhance-entry-tip b{white-space:nowrap}.air-enhance-entry-tip span{color:#56738f}
  .air-modal-overlay{position:fixed;inset:0;z-index:1200;background:rgba(23,48,72,.42);display:flex;align-items:center;justify-content:center;padding:24px}
  .air-modal-card{width:min(960px,96vw);max-height:90vh;overflow:hidden;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 24px 70px rgba(18,42,65,.24);display:flex;flex-direction:column}
  .air-modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;padding:18px 22px;border-bottom:1px solid var(--line);background:#f7fafd}.air-modal-head b{display:block;font-size:17px;color:var(--ink)}.air-modal-head span{display:block;margin-top:4px;color:var(--ink-soft);font-size:12px}.air-modal-close{border:0;background:transparent;color:var(--ink-soft);font-size:24px;cursor:pointer}

  /* ---- 消息气泡 + 操作 ---- */

    transition:opacity .15s ease;

  .air-dots span:nth-child(3){ animation-delay:.3s; }
  @keyframes airDotPulse{ 0%,80%,100%{opacity:.25; transform:scale(.85);} 40%{opacity:1; transform:scale(1);} }
  .air-loading-label{ font-size:12.5px; color:var(--ink-soft); }

  /* ===== 蓝图插画（首页） ===== */
  .hero-draft{
    position:relative; margin:2px 0 22px; border:1px solid var(--line-strong); border-radius:2px;

      linear-gradient(rgba(30,58,92,.05) 1px, transparent 1px),

  .hero-draft .l3{animation:lampGlow 3.8s ease-in-out 3.1s infinite;}
  @keyframes lampGlow{0%,100%{opacity:.15;} 50%{opacity:.9;}}

  .hero-draft .dim-t{font-family:var(--mono); font-size:8px; letter-spacing:1.5px; fill:var(--seal-red); opacity:.8;}

  /* ===== 生成进度扫描 ===== */

  /* ===== 测算明细表 ===== */
  .dt-block{margin-top:12px; border:1px solid var(--line-strong); background:#FFF; border-radius:2px;}
  .dt-block summary{
    cursor:pointer; padding:11px 16px; font-size:13px; font-weight:600; color:var(--ink);
    user-select:none; list-style:none; display:flex; align-items:center; gap:8px;
  }
  .dt-block summary::before{content:"▸"; color:var(--bp-navy); transition:transform .15s ease;}
  .dt-block[open] summary::before{transform:rotate(90deg);}
  .dt-block summary::-webkit-details-marker{display:none;}
  .dt-scroll{overflow:auto; max-height:360px; padding:0 12px 12px;}
  table.dt{margin:0; min-width:100%;}
  table.dt th, table.dt td{white-space:nowrap; text-align:right; font-family:var(--mono); font-size:11.5px;}
  table.dt th.dt-l, table.dt td.dt-l{
    text-align:left; font-family:var(--sans); font-size:12px;
    position:sticky; left:0; background:#FFF; z-index:2;
    border-right:2px solid var(--line-strong); min-width:150px;
  }
  table.dt th.dt-l{background:var(--bp-navy); z-index:3;}
  table.dt tr:nth-child(even) td.dt-l{background:#F7F5EE;}
  table.dt th{position:sticky; top:0; z-index:1;}
  table.dt .dt-sum{background:#EFF2F6 !important; font-weight:700;}
  table.dt th.dt-sum{background:var(--bp-deep) !important; color:#fff;}
  table.dt td.dt-hl, table.dt .dt-hl{color:var(--bp-navy); font-weight:700;}
