<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    /* 蓝图·公文 配色体系 */
    --bp-deep:#1E4B72;        /* 侧栏深蓝底（提亮，不再死黑） */
    --bp-navy:#2C6CA6;        /* 主蓝（与后台一致的清爽蓝） */
    --bp-line:#37659A;        /* 蓝图网格线（相应提亮） */
    --bp-cyan:#7FB3C8;        /* 绘图青（侧栏强调/眉标） */
    --paper:#F7FAFD;          /* 环境色（浅蓝白，与后台一致） */
    --paper-card:#FFFFFF;     /* 卡片纸面（纯白） */
    --ink:#1C2733;            /* 正文墨色 */
    --ink-soft:#66788C;       /* 次级文字 */
    --line:#DCE6F0;           /* 浅蓝细线（与后台一致） */
    --line-strong:#C3D2E2;
    --seal-red:#C24A42;       /* 印章朱砂（略柔和） */
    --seal-red-dim:#C24A4255;
    --ok-green:#3E7A53;
    --blueprint:var(--bp-navy);       /* 兼容旧变量名 */
    --blueprint-dim:#4A7AB0;
    --mono:"SF Mono","Cascadia Mono","Consolas","Courier New",monospace;
    --serif:"Songti SC","STSong","SimSun","Noto Serif SC",serif;
    --sans:"PingFang SC","MiSans","Microsoft YaHei","Hiragino Sans GB",sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0; padding:0;}
  body{
    background:var(--paper);
    color:var(--ink); font-family:var(--sans); -webkit-font-smoothing:antialiased;
  }

  .app{display:flex; min-height:100vh;}

  /* ============ 左侧：蓝图面板 ============ */
  .toc{
    width:230px; flex-shrink:0; background:var(--side-bg,#EEF4FA);
    border-right:1px solid var(--side-line,#DCE6F2);
    padding:22px 14px; position:sticky; top:0; height:100vh; overflow-y:auto;
  }
  .toc-title{
    font-family:var(--serif); font-size:16px; font-weight:700; color:var(--bp-deep);
    padding:2px 10px 20px;
  }
  .toc-title::after{
    content:"FEASIBILITY STUDIO"; display:block; margin-top:3px;
    font-family:var(--mono); font-size:9.5px; letter-spacing:2px; color:var(--ink-soft);
  }
  #tocList{margin-top:4px;}
  .toc-item{
    display:flex; gap:10px; align-items:center; padding:10px 12px; margin-bottom:2px;
    font-size:13.5px; color:var(--ink); border-radius:8px; position:relative; transition:background .15s ease;
  }
  .toc-item:hover{background:var(--side-hover,#E4EDF6);}
  .toc-item .num{
    font-family:var(--mono); font-size:10px; flex-shrink:0;
    width:22px; height:22px; line-height:20px; text-align:center;
    border:1px solid var(--line-strong); border-radius:50%;
    color:var(--bp-navy); background:#fff; transition:all .2s ease;
  }
  .toc-item.active{background:#FFFFFF; font-weight:600; color:var(--bp-deep); box-shadow:0 1px 3px rgba(30,75,114,.12);}
  .toc-item.active .num{background:var(--bp-navy); color:#fff; border-color:var(--bp-navy);}
  .toc-item.done{color:var(--ink-soft);}
  .toc-item.done .num{border-color:var(--bp-navy); color:#fff; background:var(--bp-navy); opacity:.55;}

  /* ============ 右侧：文档纸面 ============ */
  .sheet-wrap{flex:1; padding:44px 48px; min-width:0;}
  .sheet{
    background:var(--paper-card); max-width:860px; margin:0 auto;
    border:1px solid var(--line);
    box-shadow:0 1px 2px rgba(30,75,114,.05);
    padding:36px 44px 46px; position:relative; min-height:600px;
    border-radius:10px;
  }

  /* 页面切换时的内容浮现 */
  .sheet > *{animation:riseIn .38s cubic-bezier(.22,.8,.36,1) both;}
  .sheet > *:nth-child(2){animation-delay:.04s;}
  .sheet > *:nth-child(3){animation-delay:.08s;}
  .sheet > *:nth-child(4){animation-delay:.12s;}
  @keyframes riseIn{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:none;}}
  @media (prefers-reduced-motion: reduce){
    .sheet > *{animation:none;}
    *{transition:none !important;}
  }

  .doc-eyebrow{
    font-family:var(--mono); font-size:10.5px; letter-spacing:2.4px; color:var(--bp-navy);
    text-transform:uppercase; margin-bottom:10px; display:flex; align-items:center; gap:10px;
  }
  .doc-eyebrow::before{content:""; width:26px; height:1px; background:var(--seal-red);}
  h1.doc-title{
    font-family:var(--serif); font-size:24px; margin:0 0 10px; color:var(--bp-deep); font-weight:700;
    letter-spacing:.3px; padding-bottom:12px; border-bottom:1px solid var(--line);
  }
  .step-desc{font-size:13px; color:var(--ink-soft); margin:16px 0 22px; line-height:1.75; max-width:64ch;}
  .housing-hero{
    position:relative;height:360px;margin:22px 0 2px;overflow:hidden;
    border:1px solid #D7E7F2;border-radius:10px;
    background:linear-gradient(180deg,#FBFDFF 0%,#F5FAFD 62%,#EDF6FB 100%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.9);
  }
  .housing-hero::before{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(rgba(121,177,210,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(121,177,210,.055) 1px,transparent 1px);
    background-size:24px 24px;mask-image:linear-gradient(to bottom,transparent 4%,#000 58%,#000 100%);
  }
  .housing-hero::after{
    content:"";position:absolute;inset:-18% -6%;pointer-events:none;opacity:.58;
    background:radial-gradient(ellipse at 83% 4%,transparent 0 39%,rgba(176,215,237,.20) 39.3% 47%,transparent 47.4%),radial-gradient(ellipse at 88% 8%,transparent 0 52%,rgba(202,228,242,.22) 52.3% 59%,transparent 59.4%);
  }
  .housing-hero canvas{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none;}
  .housing-hero-head{position:absolute;z-index:3;left:28px;right:28px;top:22px;display:flex;align-items:flex-start;justify-content:space-between;gap:20px;pointer-events:none;}
  .housing-hero-copy{display:flex;flex-direction:column;min-width:0;}
  .housing-hero-copy span{font-family:var(--mono);font-size:9px;letter-spacing:2px;color:#7CAAC6;}
  .housing-hero-copy b{font-family:var(--serif);font-size:17px;letter-spacing:.5px;color:#315F7D;margin-top:7px;font-weight:600;}
  .housing-hero-copy small{font-size:10.5px;color:#88A7BB;margin-top:6px;letter-spacing:1px;}
  .housing-brand{display:flex;align-items:center;gap:8px;flex:0 0 auto;padding-top:1px;color:#287CA9;}
  .housing-brand svg{width:37px;height:34px;display:block;filter:drop-shadow(0 2px 3px rgba(35,124,170,.10));}
  .housing-brand>div{display:flex;flex-direction:column;line-height:1;}
  .housing-brand>div b{font-family:"Microsoft YaHei","PingFang SC",sans-serif;font-size:20px;font-weight:800;letter-spacing:2px;color:#327FA7;white-space:nowrap;}
  .housing-brand>div span{font-family:Arial,sans-serif;font-size:5.8px;font-weight:700;letter-spacing:.15px;color:#609AB8;margin-top:4px;white-space:nowrap;}
  .housing-hero-axis{position:absolute;z-index:2;left:28px;right:28px;bottom:13px;display:flex;align-items:center;gap:8px;color:#86A8BC;font-size:9px;letter-spacing:.7px;pointer-events:none;}
  .housing-hero-axis i{display:block;width:5px;height:5px;border:1px solid #78AFD0;border-radius:50%;background:#F7FBFE;}
  .housing-hero-axis span:not(:last-child)::after{content:"";display:inline-block;width:30px;height:1px;margin:0 0 3px 8px;background:#C4DFEE;}
  @media(max-width:820px){.housing-hero{height:300px}.housing-hero-head{left:20px;right:20px;top:18px}.housing-hero-copy b{font-size:15px}.housing-brand svg{width:30px;height:28px}.housing-brand>div b{font-size:16px}.housing-brand>div span{font-size:4.7px}.housing-hero-axis{left:20px;right:20px}.housing-hero-axis span:not(:last-child)::after{width:10px}}
  @media(max-width:560px){.housing-brand>div{display:none}.housing-brand svg{width:34px;height:31px}.housing-hero-copy small{letter-spacing:.3px}}
  @media(prefers-reduced-motion:reduce){.housing-hero canvas{opacity:.82}}

  label{display:block; font-size:12px; color:var(--ink-soft); margin:16px 0 6px; letter-spacing:.3px;}
  input[type=text],input[type=number],select,textarea{
    width:100%; font-family:var(--sans); font-size:14px; color:var(--ink);
    background:#FFFFFF; border:1px solid var(--line); border-radius:6px;
    padding:10px 12px; outline:none;
    transition:border-color .18s ease, box-shadow .18s ease;
  }
  input:focus,select:focus,textarea:focus{
    border-color:var(--bp-navy);
    box-shadow:0 0 0 3px rgba(30,58,92,.12);
  }
  textarea{min-height:80px; resize:vertical;}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:0 22px;}
  .is-editor{grid-column:1/-1;margin-top:18px;border:1px solid var(--line);border-radius:10px;background:#fff;overflow:hidden}
  .is-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:16px 18px;background:#f7f9fb;border-bottom:1px solid var(--line)}
  .is-head b{font-size:15px;color:var(--bp)}.is-head>div>div{font-size:12px;color:var(--ink-soft);margin-top:4px}.is-tools{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
  .is-gantt-scroll,.is-plan-scroll{overflow-x:auto;padding:14px 18px 4px}.is-gantt,.is-plan{border-collapse:collapse;min-width:max-content;width:100%;font-size:11px}
  .is-gantt th,.is-gantt td,.is-plan th,.is-plan td{border:1px solid #cbd5df;text-align:center;padding:0}.is-gantt th{background:#eef3f7;padding:7px 5px;min-width:52px}.is-gantt th:first-child{position:sticky;left:0;z-index:2;min-width:132px;text-align:left;padding-left:9px;background:#eef3f7}
  .is-gantt td{width:52px;height:29px}.is-qcell{display:block;width:100%;height:29px;border:0;border-radius:0;background:#fff;cursor:crosshair;padding:0}.is-qcell:hover{box-shadow:inset 0 0 0 2px var(--bp)}.is-qcell.active{background:var(--is-color)}
  .is-plan th,.is-plan td{padding:7px 8px;min-width:72px}.is-plan th{background:#f1f5f8}.is-annual{display:flex;gap:8px;flex-wrap:wrap;padding:10px 18px}.is-annual span{border:1px solid var(--line);border-radius:6px;padding:7px 10px;font-size:11.5px;background:#fafcfd}
  .is-empty,.is-errors,.is-ok{margin:10px 18px 16px;padding:9px 11px;border-radius:6px;font-size:12px}.is-empty{color:var(--ink-soft);background:#f7f9fb}.is-errors{color:#8b3a2d;background:#fff3f1}.is-ok{color:#27734a;background:#eef8f2}
  .is-sale-coeff{margin:18px;border:1px solid var(--line);border-radius:8px;overflow:hidden}.is-sale-coeff-head{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 14px;background:#f2f7f8}.is-sale-coeff-head b{color:#006b70}.is-sale-coeff-head>div>div{font-size:11.5px;color:var(--ink-soft);margin-top:3px}.is-sale-coeff-head span{font-size:11px;padding:4px 8px;border-radius:99px}.is-sale-coeff-head .ok{color:#27734a;background:#e8f6ed}.is-sale-coeff-head .err{color:#8b3a2d;background:#fff0ed}.is-sale-coeff .is-plan-scroll{padding:0}.is-sale-coeff .is-plan th:first-child{min-width:58px}.is-sale-coeff .is-plan th:nth-child(2){min-width:210px}.is-sale-coeff .is-subrow th{padding-left:24px;font-weight:500}.is-sale-coeff td.has-value{background:#e8ecef;font-weight:600;color:#334a5a}

  .btn{
    font-family:var(--sans); font-size:13.5px; font-weight:600; padding:11px 24px;
    border:1px solid var(--bp-navy); border-radius:7px;
    background:var(--bp-navy); color:#fff; cursor:pointer; letter-spacing:.5px;
    transition:filter .12s ease;
  }
  .btn:hover{filter:brightness(1.08);}
  .btn:focus-visible{outline:2px solid var(--bp-cyan); outline-offset:2px;}
  .btn.ghost{background:transparent; color:var(--bp-navy);}
  .btn.ghost:hover{background:var(--line-soft,#EAF1F8);}
  .btn:disabled{background:var(--line); border-color:var(--line); color:#98937F; cursor:not-allowed;}
  .actions{margin-top:34px; display:flex; gap:12px; justify-content:flex-end; flex-wrap:wrap;}

  .note-box{
    margin-top:24px; background:#F3F0E6;
    border:1px solid var(--line); border-top:2px solid var(--bp-navy);
    padding:13px 18px; font-size:12.5px; color:var(--ink-soft); line-height:1.7; border-radius:2px;
  }

  /* ============ AI可研生成（对话式）============ */
  /* 报告预览面板只在真正开始生成时才出现（.air-shell 不带 .solo），
     此时才需要把 #sheet 的860px正文宽度让开；采集/确认阶段还没有可预览的内容，
     维持全站统一的860px单栏宽度，不会一开始就显得又窄又挤 */
  #sheet:has(.air-shell:not(.solo)){ max-width:1180px; }

  .air-restart-row{ display:flex; justify-content:flex-start; margin-bottom:8px; }
  .air-restart-btn{
    padding:5px 13px; font-size:12px; border-radius:14px;
    border:1px solid var(--line-strong); color:var(--ink-soft); background:#fff;
  }
  .air-restart-btn:hover{ border-color:var(--seal-red,#C24A42); color:var(--seal-red,#C24A42); background:#FBEAEA; }

  .air-card{
    margin-top:6px; background:#FAFBFC; border:1px solid var(--line,#DCE6F0);
    border-radius:8px; padding:14px 16px;
  }
  .air-conf{
    display:inline-block; padding:1px 9px; border-radius:10px; font-size:11px; font-weight:600;
  }
  .air-conf-hi{ background:#E7F3EA; color:#2E7D46; }
  .air-conf-mid{ background:#FDF3DE; color:#A6740F; }
  .air-conf-lo{ background:#FBEAEA; color:var(--seal-red,#C24A42); }

  /* ---- 分栏：左聊天 / 右报告预览（只在生成开始后出现） ---- */
  .air-shell{ display:flex; gap:22px; align-items:flex-start; margin-top:16px; }
  .air-chat-pane{ flex:1 1 380px; min-width:0; display:flex; flex-direction:column; }
  /* .solo：还没开始生成，或者用户手动收起了预览——聊天区独占整行，不挤 */
  .air-shell.solo{ display:block; }
  .air-shell.solo .air-doc-pane{ display:none; }
  .air-doc-toggle{ margin:10px 0 2px; }
  .air-doc-reopen{
    font-size:12px; padding:6px 14px; border-radius:16px; border:1px solid var(--line-strong);
    background:#fff; color:var(--bp-navy); cursor:pointer; transition:all .15s ease;
  }
  .air-doc-reopen:hover{ background:var(--line-soft,#EAF1F8); border-color:var(--bp-navy); }
  .air-doc-pane{
    flex:1.15 1 420px; min-width:0; position:sticky; top:20px;
    max-height:calc(100vh - 40px); display:flex; flex-direction:column;
    border:1px solid var(--line); border-radius:10px; background:var(--paper-card,#fff);
    box-shadow:0 1px 2px rgba(30,75,114,.05); overflow:hidden;
  }
  .air-doc-pane.empty{ align-items:center; justify-content:center; padding:40px 30px; text-align:center; }
  .air-doc-empty-tip{ font-size:12.5px; color:var(--ink-soft); line-height:1.8; max-width:34ch; }
  .air-doc-empty-tip .ic{ font-size:26px; display:block; margin-bottom:10px; opacity:.6; }
  .air-doc-head{
    padding:14px 18px 12px; border-bottom:1px solid var(--line); flex-shrink:0; position:relative;
  }
  .air-doc-close{
    position:absolute; top:10px; right:12px; border:none; background:transparent; cursor:pointer;
    font-size:15px; color:var(--ink-faint,#8A97A8); line-height:1; padding:4px 7px; border-radius:5px;
    transition:all .15s ease;
  }
  .air-doc-close:hover{ background:var(--line-soft,#EAF1F8); color:var(--seal-red,#C24A42); }
  .air-doc-title{ font-family:var(--serif); font-size:16px; font-weight:700; color:var(--ink); }
  .air-doc-meta{ font-family:var(--mono); font-size:10.5px; color:var(--ink-soft); margin-top:4px; letter-spacing:.3px; }
  .air-doc-outline{
    display:flex; gap:6px; flex-wrap:wrap; padding:10px 18px; border-bottom:1px solid var(--line);
    flex-shrink:0; max-height:88px; overflow-y:auto;
  }
  .air-doc-outline .chip{
    font-size:11px; padding:3px 9px; border-radius:11px; border:1px solid var(--line-strong);
    color:var(--ink-soft); cursor:pointer; white-space:nowrap; transition:all .15s ease; background:#fff;
  }
  .air-doc-outline .chip:hover{ border-color:var(--bp-navy); color:var(--bp-navy); }
  .air-doc-outline .chip.state-gen{ border-color:var(--bp-navy); color:var(--bp-navy); background:#EAF1F8; }
  .air-doc-outline .chip.state-done{ border-color:#BFE0C9; color:#2E7D46; background:#EDF7EF; }
  .air-doc-outline .chip.state-failed{ border-color:var(--seal-red-dim,#C24A4255); color:var(--seal-red,#C24A42); background:#FBEAEA; }
  .air-doc-scroll{ flex:1; overflow-y:auto; padding:16px 20px 26px; }
  .air-doc-scroll .chapter-block{ margin-bottom:26px; }
  .air-doc-scroll .chapter-block:last-child{ margin-bottom:4px; }

  /* ---- 消息气泡 + 操作 ---- */
  .air-msg{
    margin:10px 0; padding:12px 16px; font-size:13.5px; line-height:1.8; border-radius:8px; position:relative;
  }
  .air-msg.user{ background:#EDF1F5; }
  .air-msg.assistant{ background:#FFF; border:1px solid var(--line,#DCE6F0); }
  .air-msg-copy{
    position:absolute; top:8px; right:10px; border:none; background:transparent; cursor:pointer;
    font-size:11px; color:var(--ink-faint,#8A97A8); padding:2px 6px; border-radius:4px; opacity:.5;
    transition:opacity .15s ease;
  }
  .air-msg-copy:hover{ opacity:1; background:var(--line-soft,#EAF1F8); color:var(--bp-navy); }

  /* ---- 加载骨架（原地渐变为结果，不再"消息消失又出现"）---- */
  .air-loading{ display:flex; align-items:center; gap:10px; }
  .air-dots{ display:inline-flex; gap:3px; flex-shrink:0; }
  .air-dots span{
    width:5px; height:5px; border-radius:50%; background:var(--bp-navy); opacity:.35;
    animation:airDotPulse 1.1s ease-in-out infinite;
  }
  .air-dots span:nth-child(2){ animation-delay:.15s; }
  .air-dots span:nth-child(3){ animation-delay:.3s; }
  @keyframes airDotPulse{ 0%,80%,100%{opacity:.25; transform:scale(.85);} 40%{opacity:1; transform:scale(1);} }
  .air-loading-label{ font-size:12.5px; color:var(--ink-soft); }
  .air-loading .skel{ flex:1; max-width:220px; margin:0; }

  /* ---- 生成进度卡（章节清单精简版：数字+停止/继续） ---- */
  .air-progress-card{ display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; }
  .air-progress-text{ font-size:13px; color:var(--ink); }
  .air-progress-bar{ height:4px; background:var(--line); border-radius:2px; margin-top:8px; overflow:hidden; width:100%; }
  .air-progress-bar-fill{ height:100%; background:var(--bp-navy); border-radius:2px; transition:width .3s ease; }
  .air-progress-actions{ display:flex; gap:8px; flex-shrink:0; }
  .air-progress-btn{ padding:5px 14px; font-size:11.5px; }

  /* ---- 交付卡按钮 / 子节重试按钮：统一尺寸，别在JS里逐个重复内联样式 ---- */
  .air-act-btn{ padding:7px 16px; font-size:12.5px; }
  .air-deliver-card{padding:0;overflow:hidden}.air-deliver-guide{padding:18px 20px;background:linear-gradient(135deg,#F1F7FD,#F7FBF8);border-bottom:1px solid var(--line)}.air-deliver-title{font-size:17px;font-weight:700;color:var(--bp-navy);margin-bottom:7px}.air-deliver-copy{font-size:12.5px;line-height:1.8;color:var(--ink-soft);max-width:760px}.air-deliver-prompts{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.air-prompt{padding:7px 12px;border:1px solid #AFC7DD;border-radius:16px;background:#fff;color:var(--bp-navy);font-size:11.5px;cursor:pointer}.air-prompt:hover{background:#E8F2FB;border-color:var(--bp-navy)}.air-deliver-actions{display:flex;flex-wrap:wrap;gap:9px;padding:15px 20px 8px}.air-review-primary{background:var(--bp-navy);border-color:var(--bp-navy);font-weight:700}.air-deliver-tip{padding:2px 20px 15px;font-size:11.5px;color:var(--ink-faint,#8A97A8)}
  .air-retry-btn{
    padding:3px 12px; font-size:11px; margin-left:8px; border:1px solid var(--line);
    border-radius:5px; background:#fff; cursor:pointer; color:var(--ink);
  }
  .air-retry-btn:hover{ border-color:var(--bp-navy); color:var(--bp-navy); }

  /* ---- 参数确认：信息行取代表格 ---- */
  .air-kf-row{
    display:grid; grid-template-columns:1fr 130px auto; align-items:center; gap:10px;
    padding:9px 0; border-bottom:1px solid var(--line);
  }
  .air-kf-row:last-of-type{ border-bottom:none; }
  .air-kf-label{ font-size:12.5px; color:var(--ink); }
  .air-kf-row input.air-kf{
    width:100%; padding:6px 9px; font-size:13px; border:1px solid var(--line); border-radius:6px;
    font-family:var(--mono,monospace);
  }
  .air-kf-row input.air-kf:focus{ outline:none; border-color:var(--bp-navy); }
  .air-kf-evidence{ margin-top:2px; }
  .air-kf-evidence summary{
    font-size:11px; color:var(--bp-navy); cursor:pointer; list-style:none; display:inline-flex; align-items:center; gap:3px;
  }
  .air-kf-evidence summary::-webkit-details-marker{ display:none; }
  .air-kf-evidence summary::before{ content:"▸"; font-size:9px; transition:transform .15s ease; }
  .air-kf-evidence[open] summary::before{ transform:rotate(90deg); }
  .air-kf-evidence-body{
    font-size:11.5px; color:var(--ink-soft); margin:6px 0 2px; padding:8px 10px;
    background:var(--paper,#F7FAFD); border-radius:6px; line-height:1.7;
  }
  .air-kf-src{ grid-column:1/2; font-size:11px; color:var(--ink-faint,#8A97A8); }
  .air-bulk-confirm{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:12px 0 6px;padding:13px 14px;background:#FFF4D8;border:2px solid #D89A24;box-shadow:0 4px 12px rgba(170,112,12,.12)}
  .air-bulk-confirm>div{display:flex;flex-direction:column;gap:2px;flex:1;min-width:230px}.air-bulk-confirm b{font-size:13px;color:#704600}.air-bulk-confirm span{font-size:11px;color:#8B6B31}.air-bulk-confirm .btn{background:#C77A08;border-color:#C77A08;font-weight:700;padding:9px 17px}.air-bulk-confirm .btn:hover{background:#A86100;border-color:#A86100}.air-bulk-confirm .btn.done{background:var(--ok-green);border-color:var(--ok-green)}#airConfirmAllState{width:100%;color:var(--ok-green);font-weight:600;text-align:right}
  .air-step-done{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:11px 13px;background:#EDF8F2;border:1px solid #A9D9BF;color:#236443}.air-step-done b{font-size:13px}.air-step-done span{font-size:11.5px;color:#537262}.air-complete-pill{display:inline-flex;padding:6px 11px;background:#E7F5ED;color:#236443;border:1px solid #A9D9BF;font-size:11.5px;font-weight:700}

  /* ---- 输入区：多行、自适应高度 + 示例chip ---- */
  .air-composer{ display:flex; gap:8px; margin-top:14px; align-items:flex-end; }
  .air-textarea{
    flex:1; resize:none; max-height:140px; min-height:42px; overflow-y:auto;
    font-family:var(--sans); font-size:13.5px; padding:10px 12px; border:1px solid var(--line);
    border-radius:8px; line-height:1.6; color:var(--ink);
  }
  .air-textarea:focus{ outline:none; border-color:var(--bp-navy); }
  .air-chips{ display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
  .air-chip-ex{
    font-size:11.5px; padding:5px 12px; border-radius:14px; border:1px solid var(--line-strong);
    background:#fff; color:var(--ink-soft); cursor:pointer; transition:all .15s ease;
  }
  .air-chip-ex:hover{ border-color:var(--bp-navy); color:var(--bp-navy); background:var(--line-soft,#EAF1F8); }
  .air-chips-label{ font-size:11.5px; color:var(--ink-faint,#8A97A8); width:100%; margin-bottom:2px; }
  /* 三类测算类型各给一个左边框色提示，和选中后出现的彩色标签同一套配色，选之前就能对上号 */
  .air-chip-rent{ border-left:3px solid var(--bp-navy); }
  .air-chip-sale{ border-left:3px solid #A6740F; }
  .air-chip-gaibao{ border-left:3px solid #2E7D46; }

  /* ---- 类型标签：选类型后记一条彩色胶囊，不是冒充用户说过这句话 ---- */
  .air-typetag-row{ margin:10px 0; }
  .air-typetag{
    display:inline-flex; align-items:center; gap:6px; padding:5px 14px; border-radius:14px;
    font-size:12px; font-weight:600;
  }
  .air-typetag-rent{ background:var(--line-soft,#EAF1F8); color:var(--bp-navy); }
  .air-typetag-sale{ background:#FDF3DE; color:#A6740F; }
  .air-typetag-gaibao{ background:#E7F3EA; color:#2E7D46; }

  @media (max-width:1080px){
    .air-shell{ flex-direction:column; }
    .air-doc-pane{ position:static; max-height:520px; width:100%; order:2; }
    .air-kf-row{ grid-template-columns:1fr 110px; }
    .air-kf-src{ grid-column:1/-1; }
  }

  /* 领域卡片：图纸角标 */
  .domain-grid{display:grid; grid-template-columns:1fr 1fr; gap:18px; margin-top:14px;}
  .domain-card{
    position:relative; border:1px solid var(--line); border-radius:10px;
    padding:20px 22px 16px; cursor:pointer; background:#FFFFFF;
    box-shadow:0 1px 2px rgba(30,75,114,.05);
    transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  }
  .domain-card:hover{transform:translateY(-2px); box-shadow:0 6px 16px -8px rgba(30,75,114,.25); border-color:var(--bp-navy);}
  .domain-card.sel{
    border-color:var(--bp-navy); background:var(--line-soft,#EAF1F8);
    box-shadow:inset 0 0 0 1px var(--bp-navy);
  }
  .domain-card .dn{font-family:var(--serif); font-size:17px; color:var(--ink); margin-bottom:7px; letter-spacing:.5px;}
  .domain-card .dd{font-size:12px; color:var(--ink-soft); line-height:1.6;}
  .domain-card .dc{font-family:var(--mono); font-size:10px; letter-spacing:.5px; color:var(--bp-navy); margin-top:10px;}

  /* 章节勾选 */
  .chapter-list{margin-top:10px; border-top:1px solid var(--line-strong);}
  .chapter-row{
    display:flex; align-items:center; gap:14px; padding:12px 6px;
    border-bottom:1px solid var(--line); font-size:14px;
    transition:background .15s ease;
  }
  .chapter-row:hover{background:#F5F2E9;}
  .chapter-row .num{font-family:var(--serif); color:var(--bp-navy); font-size:13px; width:28px; font-weight:700;}
  .chapter-row input[type=checkbox]{width:16px; height:16px; accent-color:var(--bp-navy); cursor:pointer;}
  .chapter-row .subcount{
    margin-left:auto; font-family:var(--mono); font-size:9.5px; letter-spacing:.5px;
    color:var(--ink-soft); border:1px solid var(--line); border-radius:10px; padding:2px 9px; background:#FFF;
  }

  .progress-line{
    font-family:var(--mono); font-size:11.5px; color:var(--bp-navy); margin-bottom:20px;
    padding:8px 12px; background:#EFF2EE; border:1px dashed var(--bp-cyan); border-radius:2px;
  }
  .chapter-block{margin-bottom:34px;}
  .chapter-block h3{
    font-family:var(--serif); font-size:18px; color:var(--ink); margin:0 0 6px;
    display:flex; align-items:baseline; gap:10px;
    border-bottom:1px solid var(--line-strong); padding-bottom:8px;
  }
  .chapter-block h3 .cn{
    font-family:var(--serif); font-size:12px; color:#fff; background:var(--bp-navy);
    padding:2px 8px; border-radius:1px; letter-spacing:2px;
  }
  .section-block{margin:16px 0 0;}
  .section-block h4{
    font-family:var(--sans); font-weight:600; font-size:14px; color:var(--bp-navy); margin:0 0 7px;
    display:flex; align-items:center; gap:8px;
  }
  .section-block h4::before{content:""; width:5px; height:5px; background:var(--seal-red); transform:rotate(45deg); flex-shrink:0;}
  .section-block .body{
    font-size:13.5px; line-height:1.9; color:var(--ink);
    outline:none; border-left:2px solid transparent; padding-left:12px;
    transition:border-color .15s ease, background .15s ease;
  }
  .section-block .body:focus{border-left-color:var(--bp-navy); background:#F6F4EC;}
  .section-block.pending .body{color:var(--ink-soft); font-style:italic;}
  .data-flag{
    display:inline-block; font-family:var(--mono); font-size:9.5px; letter-spacing:.5px;
    color:var(--seal-red); border:1px dashed var(--seal-red-dim); border-radius:2px;
    padding:2px 8px; margin-top:8px; background:#FDF6F5;
  }

  table.rpt{border-collapse:collapse; width:100%; margin:12px 0; font-size:12.5px; background:#fff;}
  table.rpt th,table.rpt td{border:1px solid var(--line-strong); padding:6px 10px; text-align:left;}
  table.rpt th{
    background:var(--bp-navy); color:#F2F5F8; font-weight:600; letter-spacing:.5px;
    border-color:var(--bp-navy);
  }
  table.rpt tr:nth-child(even) td{background:#F7F5EE;}

  .seal{
    position:absolute; bottom:40px; right:56px; width:108px; height:108px; border-radius:50%;
    border:2.5px solid var(--seal-red); color:var(--seal-red); display:flex; align-items:center; justify-content:center;
    text-align:center; font-family:var(--serif); font-size:12px; line-height:1.45; transform:rotate(-8deg);
    opacity:.92; box-shadow:inset 0 0 0 3px rgba(183,48,43,.12);
  }
  .final-banner{
    display:flex; justify-content:space-between; align-items:center;
    background:#EAF1EA; border:1px solid var(--ok-green); border-radius:2px;
    padding:13px 18px; margin-top:20px; font-size:13px; color:var(--ok-green);
  }

  /* 移动端 */
  @media (max-width: 820px){
    .app{flex-direction:column;}
    .toc{width:100%; padding:20px 22px;}
    #tocList{display:flex; gap:4px; margin-top:14px; padding-right:0; overflow-x:auto;}
    #tocList::before{display:none;}
    .toc-item{flex-direction:column; gap:6px; padding:4px 10px; font-size:11px; text-align:center; flex-shrink:0;}
    .sheet-wrap{padding:20px 14px;}
    .sheet{padding:28px 22px 40px;}
    .grid2,.domain-grid{grid-template-columns:1fr;}
  }

  /* ===== 蓝图插画（首页） ===== */
  .hero-draft{
    position:relative; margin:2px 0 22px; border:1px solid var(--line-strong); border-radius:2px;
    background:
      linear-gradient(rgba(30,58,92,.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(30,58,92,.05) 1px, transparent 1px),
      #FDFCF8;
    background-size:18px 18px;
    padding:14px 16px 8px; overflow:hidden;
  }
  .hero-draft::after{ /* 扫描光带 */
    content:""; position:absolute; top:0; bottom:0; width:90px;
    background:linear-gradient(90deg, transparent, rgba(127,179,200,.14), transparent);
    animation:heroScan 7s linear infinite;
  }
  @keyframes heroScan{from{left:-120px;} to{left:110%;}}
  .hero-draft svg{display:block; width:100%; height:auto;}
  .hero-draft path{stroke:var(--bp-navy); stroke-width:1.6; stroke-linecap:round;}
  .hero-draft .draw{stroke-dasharray:900; stroke-dashoffset:900; animation:drawLine 1.6s ease forwards;}
  .hero-draft .d1{animation-delay:.05s;} .hero-draft .d2{animation-delay:.25s;}
  .hero-draft .d3{animation-delay:.5s;}  .hero-draft .d4{animation-delay:.75s;}
  .hero-draft .d5{animation-delay:1s;}   .hero-draft .d6{animation-delay:1.25s;}
  @keyframes drawLine{to{stroke-dashoffset:0;}}
  .hero-draft .crane-flag{fill:var(--seal-red); stroke:none; opacity:0; animation:fadeIn .5s ease 1.7s forwards;}
  @keyframes fadeIn{to{opacity:1;}}
  .hero-draft .lamp{fill:var(--seal-red); stroke:none; opacity:.15;}
  .hero-draft .l1{animation:lampGlow 3.4s ease-in-out 2s infinite;}
  .hero-draft .l2{animation:lampGlow 4.2s ease-in-out 2.6s infinite;}
  .hero-draft .l3{animation:lampGlow 3.8s ease-in-out 3.1s infinite;}
  @keyframes lampGlow{0%,100%{opacity:.15;} 50%{opacity:.9;}}
  .hero-draft .dim{stroke:var(--seal-red); stroke-width:.8; opacity:.7;}
  .hero-draft .dim-t{font-family:var(--mono); font-size:8px; letter-spacing:1.5px; fill:var(--seal-red); opacity:.8;}
  .hero-draft .anno{font-family:var(--serif); font-size:10px; fill:var(--bp-navy); opacity:.75;}
  .hero-cap{
    display:block; margin-top:8px; padding-top:7px; border-top:1px solid var(--line);
    font-family:var(--mono); font-size:9px; letter-spacing:1.5px; color:var(--ink-soft);
  }

  /* ===== 领域卡片图标 ===== */
  .dm-ico{width:38px; height:38px; margin-bottom:10px; display:block;}
  .dm-ico path{stroke:var(--bp-navy); stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; transition:stroke .18s ease;}
  .dm-ico .dm-arrow{stroke:var(--seal-red);}
  .dm-ico .dm-arrow-h{fill:var(--seal-red); stroke:none;}
  .domain-card:hover .dm-ico path{stroke:var(--bp-deep);}


  /* ===== 测算指标仪表盘 ===== */
  .metric-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-top:24px;}
  .metric{
    background:#FFF; border:1px solid var(--line-strong); border-radius:2px;
    padding:16px 18px 13px; position:relative; overflow:hidden;
  }
  .metric::before{content:""; position:absolute; top:0; left:0; right:0; height:3px; background:var(--bp-navy); opacity:.25;}
  .metric .mv{font-family:var(--mono); font-size:22px; font-weight:700; color:var(--bp-navy); letter-spacing:.5px; min-height:28px;}
  .metric .ml{font-size:11px; color:var(--ink-soft); margin-top:5px; letter-spacing:.3px;}
  .metric.hl{background:linear-gradient(165deg, #24466E, var(--bp-deep)); border-color:var(--bp-deep);}
  .metric.hl::before{background:var(--seal-red); opacity:1;}
  .metric.hl .mv{color:#FFFFFF; font-size:26px;}
  .metric.hl .ml{color:var(--bp-cyan);}

  /* ===== 侧栏城市剪影 ===== */
  /* ===== 生成进度扫描 ===== */
  .progress-line{position:relative; overflow:hidden;}
  .progress-line::after{
    content:""; position:absolute; top:0; bottom:0; width:70px;
    background:linear-gradient(90deg, transparent, rgba(127,179,200,.3), transparent);
    animation:heroScan 2s linear infinite;
  }

  @media (max-width:820px){
    .metric-grid{grid-template-columns:1fr 1fr;}
    }
  @media (prefers-reduced-motion: reduce){
    .hero-draft .draw{animation:none; stroke-dashoffset:0;}
    .hero-draft .crane-flag{animation:none; opacity:1;}
    .hero-draft .lamp,.hero-draft::after,.progress-line::after{animation:none;}
  }


  /* ===== 现金流图表 ===== */
  .cf-chart{margin-top:18px; border:1px solid var(--line-strong); background:#FFF; border-radius:2px; padding:14px 16px 8px;}
  .cf-head{display:flex; justify-content:space-between; align-items:baseline; font-size:12px; color:var(--ink); font-weight:600; margin-bottom:8px;}
  .cf-legend{font-size:10.5px; color:var(--ink-soft); font-weight:400;}
  .cf-legend i{display:inline-block; vertical-align:middle; margin-right:4px;}
  .cf-legend .lg-bar{width:10px; height:10px; background:var(--bp-navy); opacity:.75;}
  .cf-legend .lg-line{width:14px; height:2px; background:var(--bp-cyan);}
  .cf-chart svg{display:block; width:100%; height:auto;}
  .cfaxis{stroke:var(--line-strong); stroke-width:1; stroke-dasharray:3 3;}
  .cfbar{fill:var(--bp-navy); opacity:.78; transform-box:fill-box; transform-origin:center bottom; animation:barUp .5s cubic-bezier(.2,.9,.3,1) both;}
  .cfbar.neg{fill:var(--seal-red); opacity:.6; transform-origin:center top;}
  @keyframes barUp{from{transform:scaleY(0);}}
  .cfline{fill:none; stroke:var(--bp-cyan); stroke-width:2.2; stroke-linejoin:round;
    stroke-dasharray:1600; stroke-dashoffset:1600; animation:drawLine 1.5s ease .55s forwards;}
  .cfx{font-family:var(--mono); font-size:8.5px; fill:var(--ink-soft);}
  .cfpay{fill:var(--seal-red); animation:payPulse 2.2s ease-in-out 2s infinite;}
  @keyframes payPulse{0%,100%{opacity:1;} 50%{opacity:.35;}}
  .cfpay-t{font-family:var(--serif); font-size:10px; fill:var(--seal-red);}

  /* ===== 生成骨架屏与落章 ===== */
  .skel{display:block; height:11px; margin:8px 0; border-radius:2px;
    background:linear-gradient(90deg,#EAE6D9 25%,#F6F3E9 42%,#EAE6D9 58%);
    background-size:280% 100%; animation:skelMove 1.8s linear infinite;}
  .section-block.gen .skel{
    background:linear-gradient(90deg,#D9E2EA 25%,#EFF5F9 42%,#D9E2EA 58%);
    background-size:280% 100%; animation:skelMove .85s linear infinite;}
  @keyframes skelMove{from{background-position:130% 0;} to{background-position:-130% 0;}}
  .section-block.gen h4::after{
    content:"绘制中"; font-family:var(--mono); font-size:9px; letter-spacing:1px;
    color:var(--seal-red); border:1px solid var(--seal-red-dim); border-radius:2px;
    padding:1px 7px; margin-left:4px; animation:blinkSoft 1.1s ease-in-out infinite;}
  @keyframes blinkSoft{50%{opacity:.3;}}
  .done-stamp{
    font-family:var(--serif); font-size:10px; color:var(--seal-red);
    border:1.5px solid var(--seal-red); border-radius:2px; padding:1px 6px; margin-left:4px;
    display:inline-block; transform:rotate(-6deg);
    animation:stampIn .38s cubic-bezier(.16,1,.3,1) both;}
  @keyframes stampIn{0%{transform:rotate(-6deg) scale(2.1); opacity:0;} 100%{transform:rotate(-6deg) scale(1); opacity:1;}}

  /* ===== 签发盖章动画 ===== */
  .seal{animation:sealDrop .55s cubic-bezier(.16,1,.3,1) both;}
  @keyframes sealDrop{
    0%{transform:rotate(-8deg) scale(2.6); opacity:0;}
    55%{transform:rotate(-8deg) scale(.9); opacity:1;}
    100%{transform:rotate(-8deg) scale(1); opacity:.92;}}

  /* ===== 项目档案图签卡 ===== */
  .arch-card{
    display:grid; grid-template-columns:2.2fr 1.1fr 1.3fr 1fr 1.1fr;
    border:1.5px solid var(--bp-navy); border-radius:2px; margin:18px 0 4px;
    background:#FFF; overflow:hidden;}
  .ac-cell{padding:9px 13px 8px; border-right:1px solid var(--line-strong); min-width:0;}
  .ac-cell:last-child{border-right:none;}
  .ac-l{display:block; font-family:var(--mono); font-size:8.5px; letter-spacing:1.5px; color:var(--ink-soft); margin-bottom:4px;}
  .ac-v{display:block; font-size:13px; color:var(--ink); font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .ac-mono{font-family:var(--mono); font-size:12px; letter-spacing:.5px;}
  .ac-draft{color:var(--seal-red);}
  .ac-ok{color:var(--ok-green);}

  @media (max-width:820px){
    .arch-card{grid-template-columns:1fr 1fr;}
    .ac-cell{border-bottom:1px solid var(--line);}
  }
  @media (prefers-reduced-motion: reduce){
    .cfbar,.cfline,.cfpay,.skel,.section-block.gen h4::after,.done-stamp,.seal{animation:none;}
    .cfline{stroke-dashoffset:0;}
  }


  /* ===== 章节锚点导航 ===== */
  #anchorNav{
    position:fixed; right:18px; top:50%; transform:translateY(-50%);
    display:flex; flex-direction:column; gap:4px; z-index:50;
  }
  #anchorNav a{
    display:block; width:30px; height:30px; line-height:30px; text-align:center;
    font-family:var(--serif); font-size:12px; text-decoration:none;
    color:var(--bp-navy); background:var(--paper-card); border:1px solid var(--line-strong);
    border-radius:2px; transition:all .15s ease;
  }
  #anchorNav a:hover{background:var(--bp-navy); color:#fff; transform:translateX(-3px);}
  @media (max-width:1200px){ #anchorNav{display:none;} }

  /* ===== 草稿恢复条 ===== */
  .draft-bar{
    max-width:860px; margin:0 auto 16px; padding:12px 18px;
    background:#FCF8EC; border:1px solid #D8B85A; border-top:2px solid #C79A2A; border-radius:2px;
    font-size:13px; color:#6B5416; display:flex; justify-content:space-between; align-items:center; gap:14px; flex-wrap:wrap;
    animation:riseIn .4s ease both;
  }
  .draft-bar span{display:flex; gap:8px;}

  /* ===== 单节重写按钮 ===== */
  .regen-btn{
    margin-left:auto; font-family:var(--mono); font-size:10px; letter-spacing:.5px;
    padding:2px 10px; border:1px solid var(--line-strong); border-radius:2px;
    background:#FFF; color:var(--bp-navy); cursor:pointer; transition:all .15s ease;
  }
  .regen-btn:hover{background:var(--bp-navy); color:#fff; border-color:var(--bp-navy);}
  .regen-btn:disabled{opacity:.5; cursor:wait;}
  .section-block h4{display:flex; align-items:center; gap:8px;}

  /* ===== 生成进度条吸顶 ===== */
  .progress-line{position:sticky; top:10px; z-index:20; box-shadow:0 4px 14px -8px rgba(19,42,67,.35);}

  /* ===== 表格与长内容防溢出 ===== */
  .section-block .body{overflow-x:auto;}
  table.rpt{min-width:320px;}

  /* ===== 页脚 ===== */
  .site-foot{
    max-width:860px; margin:22px auto 6px; padding:14px 4px 0;
    border-top:1px solid var(--line); text-align:center;
    font-size:11px; color:var(--ink-soft); letter-spacing:.3px; line-height:1.8;
  }


  /* ===== 用户栏 ===== */
  .user-bar{
    max-width:860px; margin:0 auto 14px; padding:8px 14px;
    display:flex; align-items:center; gap:14px;
    background:var(--paper-card); border:1px solid var(--line-strong); border-radius:2px;
