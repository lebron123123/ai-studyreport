name: 质量与发布门禁

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: migration_gate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d migration_gate"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/migration_gate
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: 安装根项目与本地服务依赖
        run: npm ci
      - name: 安装浏览器测试运行时
        run: npx playwright install --with-deps chromium
      - name: JavaScript 语法检查
        run: npm run check:syntax
      - name: 规则、表格、API 与迁移一致性
        run: npm run check:release
      - name: 空库、重复执行与旧库升级迁移验证
        run: npm run check:migrations -- --require-db
      - name: Golden Project 定向回归
        run: npm run test:golden
      - name: 全仓自动化测试（独立数据库，禁止跳过行为验证）
        run: node scripts/run-postgres-tests.mjs
