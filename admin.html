<meta charset="utf-8"> 
<title>可研报告工坊 · 大纲管理</title>
<style>
  :root{
    --bp:#2C6CA6;--bp-deep:#1E4B72;--bg:#F7FAFD;--card:#FFFFFF;--ink:#1C2733;--soft:#66788C;
    --line:#DCE6F0;--line-soft:#EAF1F8;--red:#C24A42;--ok:#3E7A53;
    --side-bg:#EEF4FA;--side-line:#DCE6F2;--side-active:#FFFFFF;--side-hover:#E4EDF6;
    --mono:"SF Mono","Consolas",monospace;--sans:"PingFang SC","Microsoft YaHei",sans-serif;--serif:"Songti SC","SimSun",serif;
  }
  *{box-sizing:border-box;} body{margin:0;background:var(--bg);font-family:var(--sans);color:var(--ink);}
  .shell{display:flex;min-height:100vh;}
  /* ===== 左侧导航栏 ===== */
  .side{width:230px;flex-shrink:0;background:var(--side-bg);border-right:1px solid var(--side-line);
    padding:22px 14px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;}
  .side-brand{padding:2px 10px 20px;}
  .side-brand .t1{font-family:var(--serif);font-size:16px;font-weight:700;color:var(--bp-deep);}
  .side-brand .t2{font-size:10.5px;letter-spacing:.12em;color:var(--soft);margin-top:2px;}
  .nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;font-size:13.5px;
    color:var(--ink);cursor:pointer;margin-bottom:2px;transition:background .15s ease-out;user-select:none;}
  .nav-item:hover{background:var(--side-hover);}
  .nav-item.active{background:var(--side-active);font-weight:600;color:var(--bp-deep);box-shadow:0 1px 3px rgba(30,75,114,.12);}
  .nav-item .ic{font-size:15px;width:18px;text-align:center;flex-shrink:0;}
  .nav-sep{height:1px;background:var(--side-line);margin:12px 4px;}
  .side-foot{margin-top:auto;padding:10px 12px;font-size:11px;color:var(--soft);}
  /* ===== 右侧内容区 ===== */
  .main{flex:1;min-width:0;padding:30px 40px;max-width:960px;}
  h1{font-family:var(--serif);font-size:21px;color:var(--bp-deep);margin:0 0 6px;}
  .sub{font-size:12.5px;color:var(--soft);margin-bottom:22px;}
  .bar{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap;align-items:center;}
  .btn{font-size:13px;font-weight:600;padding:9px 18px;border:1px solid var(--bp);border-radius:7px;background:var(--bp);color:#fff;cursor:pointer;transition:filter .12s ease-out;}
  .btn:hover{filter:brightness(1.08);} .btn.ghost{background:transparent;color:var(--bp);} .btn.ghost:hover{background:var(--line-soft);}
  .btn:disabled{opacity:.4;cursor:not-allowed;}
  .btn.sm{padding:5px 12px;font-size:12px;border-radius:6px;}
  .btn.red{background:var(--red);border-color:var(--red);} .btn.red:hover{filter:brightness(1.08);}
  input,textarea,select{font-family:var(--sans);font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:#fff;width:100%;outline:none;transition:border-color .12s ease-out;}
  input:focus,textarea:focus{border-color:var(--bp);}
  label{display:block;font-size:12px;color:var(--soft);margin:12px 0 4px;}
  .card{background:var(--card);border:1px solid var(--line);padding:18px 22px;margin-bottom:12px;border-radius:10px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 1px 2px rgba(30,75,114,.05);}
  .card .name{font-weight:600;font-size:15px;} .card .meta{font-size:11px;color:var(--soft);font-family:var(--mono);}
  .card .ops{display:flex;gap:8px;}
  .empty{text-align:center;color:var(--soft);padding:40px 0;}
  .ch-list{margin-top:10px;} .ch-row{border:1px solid var(--line);margin-bottom:8px;background:#fff;padding:12px 14px;border-radius:8px;}
  .ch-head{display:flex;gap:10px;align-items:center;margin-bottom:8px;}
  .ch-head input{flex:1;font-weight:600;}
  .sec-row{display:flex;gap:8px;align-items:center;margin:4px 0 4px 24px;}
  .sec-row input{flex:1;} .sec-row select{width:70px;flex-shrink:0;}
  .add-link{font-size:12px;color:var(--bp);cursor:pointer;margin-left:24px;margin-top:4px;display:inline-block;}
  .add-link:hover{text-decoration:underline;}
  .msg{padding:10px 14px;margin-bottom:14px;font-size:13px;border-radius:8px;}
  .msg.ok{background:#EAF6EE;color:var(--ok);border:1px solid #BFE0CA;}
  .msg.err{background:#FCEEEC;color:var(--red);border:1px solid #F0C6C0;}
  .preview{background:var(--line-soft);border:1px solid var(--line);padding:14px 18px;margin-top:14px;font-size:13px;max-height:300px;overflow-y:auto;white-space:pre-wrap;font-family:var(--mono);color:var(--soft);border-radius:8px;}
  /* 通用小组件复用的表格样式 */
  .tbl{border-collapse:collapse;} .tbl th,.tbl td{padding:6px 8px;border-bottom:1px solid var(--line-soft);}
  .tbl th{color:var(--soft);font-weight:600;}
  /* 工期后台：紧凑配置表 + 独立可缩放预览 */
  .sch-config-scroll{overflow:auto;border:1px solid var(--line);border-radius:8px;background:#fff;}
  .sch-config-table{width:100%;table-layout:fixed;font-size:12px;}
  .sch-config-table th,.sch-config-table td{padding:7px 6px;vertical-align:middle;}
  .sch-config-table input,.sch-config-table select{font-size:12px;padding:6px 7px;min-width:0;}
  .sch-stage-tags{display:flex;gap:4px;flex-wrap:wrap;align-items:center;max-width:220px;}
  .sch-stage-tag{display:inline-flex;align-items:center;max-width:104px;padding:2px 7px;border-radius:99px;background:#EEF4FA;color:var(--bp-deep);font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .sch-preview-card{margin-top:12px;border:1px solid var(--line);border-radius:9px;background:#fff;overflow:hidden;box-shadow:0 1px 2px rgba(30,75,114,.04);}
  .sch-preview-card>summary{cursor:pointer;font-weight:700;color:var(--bp-deep);padding:11px 14px;background:#F8FBFE;list-style-position:inside;}
  .sch-preview-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 12px;border-top:1px solid var(--line);border-bottom:1px solid var(--line-soft);font-size:11px;color:var(--soft);}
  .sch-zoom{display:flex;gap:4px;flex-shrink:0;}
  .sch-zoom button{border:1px solid var(--line);background:#fff;color:var(--soft);border-radius:5px;padding:3px 8px;font-size:10.5px;cursor:pointer;}
  .sch-zoom button.active{border-color:var(--bp);background:#EAF3FB;color:var(--bp-deep);font-weight:700;}
  .sch-preview-scroll{overflow:auto;max-height:540px;padding:10px;background:#fff;}
  .sch-preview-canvas{zoom:var(--sch-zoom,.8);transform-origin:top left;}
  .sch-gantt{width:100%;table-layout:fixed;font-size:11px;border:1px solid var(--line);}
  .sch-gantt th,.sch-gantt td{padding:4px 2px;height:27px;border:1px solid var(--line);text-align:center;}
  .sch-gantt th:first-child{width:118px;text-align:left;padding-left:8px;white-space:nowrap;position:sticky;left:0;background:#F3F7FA;z-index:2;}
  .sch-gantt tr:first-child th{font-size:10px;white-space:nowrap;}
  .sch-ratio-preview{width:100%;min-width:720px;font-size:11px;border:1px solid var(--line);}
  .sch-ratio-preview th,.sch-ratio-preview td{padding:5px 7px;border:1px solid var(--line);text-align:center;white-space:nowrap;}
  .sch-ratio-preview th:nth-child(2),.sch-ratio-preview td:nth-child(2){text-align:left;min-width:160px;}
  /* ===== 运维看板 stat卡片 —— 参考开源Tabler dashboard(github.com/tabler/tabler)的间距/层级比例，
     配色换成本站既有变量，不引入外部CSS依赖。此前误把行内flex的.card当成通用容器用，
     标题文字被挤成竖排，这里改用专门的块级容器规避同样的问题。 */
  .stat-page{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px 22px;box-shadow:0 1px 3px rgba(30,75,114,.05);}
  .stat-page-title{font-weight:700;font-size:15px;color:var(--bp-deep);}
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px;}
  .stat-card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:16px 18px;}
  .stat-label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--soft);font-weight:600;display:flex;align-items:center;gap:6px;}
  .stat-num{font-size:26px;font-weight:700;color:var(--ink);margin-top:8px;line-height:1.1;}
  .stat-num .unit{font-size:13px;font-weight:400;color:var(--soft);margin-left:4px;}
  .stat-bar-track{height:6px;background:var(--line-soft);border-radius:99px;margin-top:10px;overflow:hidden;}
  .stat-bar-fill{height:100%;border-radius:99px;transition:width .3s ease-out;}
  .stat-badge{display:inline-block;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;padding:2px 8px;border-radius:99px;margin-top:9px;}
  .stat-badge.ok{background:#EAF6EE;color:var(--ok);}
  .stat-badge.warn{background:#FFF3E0;color:#B26A00;}
  .stat-badge.err{background:#FCEEEC;color:var(--red);}
  .stat-mini-row{display:flex;justify-content:space-between;font-size:12.5px;padding:5px 0;border-bottom:1px dashed var(--line-soft);}
  .stat-mini-row:last-child{border-bottom:none;}
  .stat-mini-label{color:var(--soft);}
  .stat-mini-val{font-weight:600;font-family:var(--mono);}
  .stat-mini-head{font-size:11px;color:var(--soft);font-weight:600;margin:12px 0 2px;}
  .stat-mini-head:first-child{margin-top:2px;}
  .stat-foot{font-size:11px;color:var(--soft);margin-top:12px;}
  .stat-kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:6px;}
  .stat-kpi .stat-label{font-size:10.5px;}
  .stat-kpi .stat-num{font-size:20px;margin-top:6px;}

  /* 参数治理中心：中文主标签、草稿/发布状态、知识依据选择器 */
  .pg-toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px;}
  .pg-toolbar input{max-width:260px;}
  .pg-summary{display:grid;grid-template-columns:repeat(4,minmax(110px,1fr));gap:8px;margin-top:12px;}
  .pg-summary>div{background:#fff;border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:11px;color:var(--soft);}
  .pg-summary b{display:block;font-size:18px;color:var(--bp-deep);margin-top:2px;}
  .pg-param-cn{font-weight:700;color:var(--ink);white-space:nowrap;}.pg-param-key{font:10px var(--mono);color:var(--soft);margin-top:2px;}
  .pg-tag{display:inline-block;padding:2px 7px;border-radius:99px;background:var(--line-soft);font-size:10px;color:var(--bp-deep);white-space:nowrap;}
  .pg-evidence-btn{white-space:nowrap;max-width:170px;overflow:hidden;text-overflow:ellipsis;}
  .pg-draft{color:#B26A00}.pg-published{color:var(--ok)}
  .pg-modal{position:fixed;inset:0;background:rgba(20,30,48,.55);z-index:9998;display:flex;align-items:center;justify-content:center;padding:20px;}
  .pg-modal-box{background:#fff;width:min(760px,94vw);max-height:82vh;border-radius:10px;box-shadow:0 14px 45px rgba(0,0,0,.2);padding:20px;display:flex;flex-direction:column;}
  .pg-ref-list{overflow:auto;border:1px solid var(--line);margin-top:10px;max-height:430px;}
  .pg-ref-item{display:flex;gap:9px;padding:9px 10px;border-bottom:1px solid var(--line-soft);align-items:flex-start;font-size:12px;}
  .pg-ref-item input{width:auto;margin-top:2px}.pg-ref-item small{display:block;color:var(--soft);margin-top:2px;}
  @media(max-width:760px){.pg-summary{grid-template-columns:1fr 1fr;}}

  /* RAG等子页面的二级标签导航(替代原来容易换行的文字链接行) */
  .subnav{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 4px;}
  .subnav a{font-size:12.5px;padding:6px 13px;border-radius:20px;background:var(--line-soft);color:var(--bp-deep);
    text-decoration:none;border:1px solid transparent;transition:background .12s ease-out;}
  .subnav a:hover{background:#DCEBF7;}
  /* 前台知识投稿审核工作台 */
  .contrib-filter{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.contrib-filter button{padding:6px 12px;border:1px solid var(--line);background:#fff;color:var(--soft);border-radius:18px;cursor:pointer}.contrib-filter button.active{background:var(--bp-deep);border-color:var(--bp-deep);color:#fff}.contrib-card{display:block;background:#fff;border:1px solid var(--line);border-radius:9px;padding:15px 17px;margin-bottom:10px}.contrib-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.contrib-title{font-size:15px;font-weight:700}.contrib-meta{font-size:11px;color:var(--soft);margin-top:5px}.contrib-kind{display:inline-block;font-size:10.5px;padding:2px 8px;border-radius:99px;background:#EAF3FB;color:var(--bp-deep);margin-right:6px}.contrib-body{white-space:pre-wrap;max-height:180px;overflow:auto;background:#F8FAFC;border-left:3px solid var(--line);padding:9px 11px;margin:10px 0;font-size:12px;line-height:1.7}.contrib-source{font-size:11px;color:var(--soft)}.contrib-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}.contrib-note{padding:8px 10px;background:#FFF8E8;color:#8B5B10;font-size:12px;margin-top:8px}.contrib-target{padding:8px 10px;background:#EAF6EE;color:var(--ok);font-size:12px;margin-top:8px}
</style>

<script>
function getToken(){ return localStorage.getItem("fs_token"); }
function getUser(){ return localStorage.getItem("fs_user"); }
function authHeaders(){ const t=getToken(); const h = t? {"Authorization":"Bearer "+t,"Content-Type":"application/json"}:{"Content-Type":"application/json"}; const ap = sessionStorage.getItem("adminPass"); if(ap) h["x-admin-pass"]=ap; return h; }
function msg(text,type){ document.getElementById("msgBox").innerHTML='<div class="msg '+type+'">'+text+'</div>'; setTimeout(()=>{document.getElementById("msgBox").innerHTML="";},4000); }


/* ===== 管理员二次密码门 ===== */
async function adminGate(){
  // 已有本会话密码则先静默验证
  const cached = sessionStorage.getItem("adminPass");
  try{
    const r = await fetch("/api/adminpass",{method:"POST",headers:authHeaders(),body:JSON.stringify({pass:cached||""})});
    const d = await r.json();
    if(d.ok) return true;   // 密码正确或未启用
  }catch(e){}
  sessionStorage.removeItem("adminPass");
  return new Promise(resolve=>{
    const ov = document.createElement("div");
    ov.id = "adminGate";
    ov.style.cssText = "position:fixed;inset:0;background:rgba(20,30,48,.92);z-index:9999;display:flex;align-items:center;justify-content:center;";
    ov.innerHTML = '<div style="background:#FDFBF3;padding:34px 38px;max-width:360px;width:90%;border-top:4px solid var(--navy,#1F3A5F);">'
      +'<div style="font-weight:700;font-size:16px;">后台安全验证</div>'
      +'<div style="font-size:12px;color:#8B8578;margin:6px 0 14px;">此后台管理大纲、测算参数与知识库，请输入管理员密码。</div>'
      +'<input id="agPass" type="password" placeholder="管理员密码" style="width:100%;padding:9px 10px;font-size:14px;box-sizing:border-box;">'
      +'<div id="agErr" style="color:#B33;font-size:12px;min-height:16px;margin-top:6px;"></div>'
      +'<button id="agGo" class="btn" style="width:100%;margin-top:8px;">进入后台</button></div>';
    document.body.appendChild(ov);
    const doCheck = async ()=>{
      const p = document.getElementById("agPass").value;
      if(!p) return;
      const btn = document.getElementById("agGo");
      btn.disabled = true; btn.textContent = "验证中…";
      try{
        const r = await fetch("/api/adminpass",{method:"POST",headers:authHeaders(),body:JSON.stringify({pass:p})});
        const d = await r.json();
        if(d.ok){ sessionStorage.setItem("adminPass", p); ov.remove(); resolve(true); return; }
        document.getElementById("agErr").textContent = d.error || "验证失败";
      }catch(e){ document.getElementById("agErr").textContent = "网络错误"; }
      btn.disabled = false; btn.textContent = "进入后台";
    };
    document.getElementById("agGo").onclick = doCheck;
    document.getElementById("agPass").addEventListener("keydown", e=>{ if(e.key==="Enter") doCheck(); });
    setTimeout(()=>document.getElementById("agPass").focus(), 100);
  });
}

/* ================= 黄金范例库 ================= */
let exList = [];
async function openExamples(){
  document.getElementById("listBox").style.display="none";
  const box = document.getElementById("editBox");
  box.style.display="block";
  box.innerHTML = '<div style="padding:30px 0; color:var(--soft);">加载范例库…</div>';
  try{
    const r = await fetch("/api/calcconfig",{headers:authHeaders()});
    const d = await r.json();
    exList = (d.ok && d.config && d.config.examples)? d.config.examples : [];
  }catch(e){ exList = []; }
  renderExamples();
}
function renderExamples(){
  const box = document.getElementById("editBox");
  box.innerHTML = '<h1 style="font-size:18px;">黄金范例库</h1>'
    +'<div class="sub">为章节配置优秀范文。生成时按<b>匹配关键词</b>命中章节标题即注入（最多2篇/节，每篇截取前1800字），并要求AI学习结构与深度、不得照抄数据。关键词可填多个（逗号分隔），如"市场分析,供需"。</div>'
    +'<div id="exList">'+exList.map((e,i)=>exRowHtml(e,i)).join("")+'</div>'
    +'<span class="add-link" id="addEx" style="margin-left:0;">+ 添加范例</span>'
    +'<div class="bar" style="margin-top:18px;"><button class="btn" id="saveEx">保存范例库</button>'
    +'<button class="btn ghost" id="exBack">返回列表</button></div>';
  document.getElementById("addEx").onclick = ()=>{ readExForm(); exList.push({match:"",title:"",content:""}); renderExamples(); };
  document.getElementById("saveEx").onclick = saveExamples;
  document.getElementById("exBack").onclick = ()=>{ setActiveNav("btnRefresh"); loadList(); };
  document.querySelectorAll("[data-exdel]").forEach(b=>b.onclick=()=>{ readExForm(); exList.splice(+b.dataset.exdel,1); renderExamples(); });
}

function loadScript(src){ return new Promise((ok,err)=>{ const s=document.createElement("script"); s.src=src; s.onload=ok; s.onerror=()=>err(new Error("加载失败:"+src)); document.head.appendChild(s); }); }

// 把解析出的HTML转成"保留表格结构"的纯文本：
// 表格转为 Markdown 表格（| 分隔 + 表头分隔行），其余按段落换行，避免结构信息丢失
function htmlToStructuredText(html){
  const doc = new DOMParser().parseFromString("<div>"+html+"</div>", "text/html");
  const root = doc.body.firstChild;
  if(!root) return "";
  const cellText = (td)=> (td.textContent||"").replace(/\s+/g," ").replace(/\|/g,"｜").trim();
  const walk = (node)=>{
    let out = "";
    node.childNodes.forEach(n=>{
      if(n.nodeType === 3){ out += n.textContent; return; }
      if(n.nodeType !== 1) return;
      const tag = n.tagName.toLowerCase();
      if(tag === "table"){
        // 嵌套表格：只处理最外层，内层表格的内容按纯文字并入单元格，避免行列错乱
        const rows = [...n.querySelectorAll("tr")].filter(tr=> tr.closest("table") === n);
        if(!rows.length) return;
        const matrix = rows.map(tr=> [...tr.querySelectorAll("th,td")].map(cellText));
        const width = Math.max(...matrix.map(r=>r.length));
        const lines = [];
        matrix.forEach((r, ri)=>{
          while(r.length < width) r.push("");
          lines.push("| " + r.join(" | ") + " |");
          if(ri === 0) lines.push("|" + Array(width).fill("---").join("|") + "|");   // Markdown表头分隔行
        });
        out += "\n\n[表格开始]\n" + lines.join("\n") + "\n[表格结束]\n\n";
        return;
      }
      if(tag === "br"){ out += "\n"; return; }
      const isBlock = ["p","div","h1","h2","h3","h4","h5","h6","li","tr","section"].includes(tag);
      out += walk(n);
      if(isBlock) out += "\n";
    });
    return out;
  };
  // 清理：行首尾空白、3个以上连续换行压成2个（HTML里的缩进会带进大量无意义空白）
  return walk(root)
    .split("\n").map(l=>l.replace(/[ \t\u3000]+/g, " ").trim()).join("\n")
    .replace(/\n{3,}/g, "\n\n").trim();
}

async function ragParseFile(f){
  const ext = (f.name.split(".").pop()||"").toLowerCase();
  if(ext==="txt") return await f.text();
  if(ext==="csv") return await f.text();
  if(["xlsx","xls","xlsm"].includes(ext)){
    // 本地部署没有云端 toMarkdown；Excel 在浏览器端解析成“表用途摘要”供 RAG 检索。
    // 原始数值、公式及单元格坐标由 indexExcelWorkbook 单独写入结构化台账，绝不依赖此摘要取数。
    if(!window.XLSX) await loadScript("xlsx.full.min.js");
    const wb = XLSX.read(await f.arrayBuffer(), {cellFormula:true, cellText:true});
    return wb.SheetNames.map(name=>{
      const ws=wb.Sheets[name], range=ws["!ref"]; if(!range) return "工作表："+name+"（空表）";
      const r=XLSX.utils.decode_range(range), heads=[];
      for(let c=r.s.c;c<=Math.min(r.e.c,r.s.c+19);c++){const cell=ws[XLSX.utils.encode_cell({r:r.s.r,c})]; if(cell) heads.push(String(cell.w??cell.v??"").slice(0,80));}
      return "工作表："+name+"\n使用范围："+range+"\n首行字段："+heads.filter(Boolean).join("｜")+"\n该工作表已建立结构化单元格索引，精确数字请通过资料台账读取。";
    }).join("\n\n");
  }
  if(ext==="docx"){
    if(!window.mammoth) await loadScript("mammoth.min.js");
    // 用 convertToHtml 而非 extractRawText：后者会把表格拍平成一串无结构文字，
    // 导致"哪个数字属于哪一行哪一列"的关系全部丢失，检索出来AI对不上表头
    const res = await window.mammoth.convertToHtml({arrayBuffer: await f.arrayBuffer()});
    return htmlToStructuredText(res.value || "");
  }
  if(ext==="pdf"){
    if(!window.pdfjsLib) await loadScript("pdf.min.js");
    window.pdfjsLib.GlobalWorkerOptions.workerSrc = "pdf.worker.min.js";
    const pdf = await window.pdfjsLib.getDocument({data: await f.arrayBuffer()}).promise;
    const parts = [];
    for(let p=1; p<=pdf.numPages; p++){ const tc = await (await pdf.getPage(p)).getTextContent(); parts.push("【第"+p+"页】\n"+pdfPageStructuredText(tc)); }
    const text = parts.join("\n");
    // 文字层为空 → 大概率是扫描件；PDF扫描件本系统无法自动识别，明确提示而不是静默入库空内容
    if(text.replace(/\s/g,"").length < 20) return await localOcrPdf(pdf);
    return text;
  }
  if(["png","jpg","jpeg","webp"].includes(ext)) return await localOcrBlob(f);
  // 其余格式交给后端 Workers AI 解析：图片走视觉模型（≈OCR）、Office/网页/表格等
  const SERVER_PARSE = ["png","jpg","jpeg","webp","svg","xlsx","xls","xlsm","csv","html","htm","xml","ods","odt","numbers"];
  if(SERVER_PARSE.includes(ext)){
    if(f.size > 8*1024*1024) throw new Error("文件超过8MB，请压缩或拆分后再上传");
    const buf = await f.arrayBuffer();
    // ArrayBuffer → base64（分片处理，避免大文件时调用栈溢出）
    const bytes = new Uint8Array(buf);
    let binary = "";
    const CH = 0x8000;
    for(let i=0;i<bytes.length;i+=CH) binary += String.fromCharCode.apply(null, bytes.subarray(i, i+CH));
    const b64 = btoa(binary);
    const r = await fetch("/api/rag",{method:"POST",headers:authHeaders(),
      body:JSON.stringify({action:"parseFile", name:f.name, dataBase64:b64})});
    const d = await r.json();
    if(!d.ok) throw new Error(d.error||"解析失败");
    return d.text||"";
  }
  throw new Error("不支持 ."+ext+"（支持：txt/docx/pdf/图片(png,jpg,webp)/xlsx/csv/html/xml 等）");
}
async function localOcrBlob(blob){
  const buf=await blob.arrayBuffer(),bytes=new Uint8Array(buf);let binary="";for(let i=0;i<bytes.length;i+=0x8000)binary+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));
  const r=await fetch("/api/local-ocr",{method:"POST",headers:authHeaders(),body:JSON.stringify({dataBase64:btoa(binary)})}),d=await r.json();if(!d.ok)throw new Error(d.error||"本地OCR失败");return d.text||"";
}
async function localOcrPdf(pdf){
  const parts=[];for(let p=1;p<=pdf.numPages;p++){
    const page=await pdf.getPage(p),vp=page.getViewport({scale:2}),canvas=document.createElement("canvas");canvas.width=Math.ceil(vp.width);canvas.height=Math.ceil(vp.height);await page.render({canvasContext:canvas.getContext("2d"),viewport:vp}).promise;
    const blob=await new Promise(ok=>canvas.toBlob(ok,"image/jpeg",0.9));const t=await localOcrBlob(blob);parts.push("【第"+p+"页】\n"+t);
  }const text=parts.join("\n\n");if(text.replace(/\s/g,"").length<20)throw new Error("扫描PDF完成OCR，但未识别到足够文字，请检查清晰度");return text;
}
function pdfPageStructuredText(tc){
  const items=(tc.items||[]).filter(x=>String(x.str||"").trim()).map(x=>({s:String(x.str),x:Number(x.transform&&x.transform[4]||0),y:Number(x.transform&&x.transform[5]||0),w:Number(x.width||0)})).sort((a,b)=>Math.abs(b.y-a.y)>2?b.y-a.y:a.x-b.x);
  const lines=[];for(const it of items){let line=lines.find(l=>Math.abs(l.y-it.y)<=2);if(!line){line={y:it.y,a:[]};lines.push(line);}line.a.push(it);}
  return lines.sort((a,b)=>b.y-a.y).map(l=>{l.a.sort((a,b)=>a.x-b.x);let out="",end=0,gaps=0;for(const it of l.a){const gap=it.x-end;if(out&&gap>18){out+=" | ";gaps++;}else if(out&&gap>3)out+=" ";out+=it.s;end=it.x+it.w;}return gaps>=2?"| "+out+" |":out;}).join("\n");
}
// 语义切块:按标题分节 → 节内按句子边界+重叠切块 → 每块带上下文锚点
// 内容哈希：用于识别"改了文件名但内容相同"的真重复
async function ragContentHash(text){
  try{
    const buf = new TextEncoder().encode(String(text||""));
    const digest = await crypto.subtle.digest("SHA-256", buf);
    return Array.from(new Uint8Array(digest)).map(b=>b.toString(16).padStart(2,"0")).join("");
  }catch(e){ return ""; }   // 不支持时降级为空，仅按文件名判断
}

const RAG_CHUNK_SIZE = 1000;   // 兼容保留：未指定分类时的默认值

function ragSplitBySentence(text, size, overlap){
  // 在句子边界(。！？；\n)切,尽量不从句中劈开;相邻块保留overlap重叠
  const parts = [];
  let i = 0;
  const N = text.length;
  while(i < N){
    let end = Math.min(i + size, N);
    if(end < N){
      // 从end往回找最近的句子边界,窗口内找不到就硬切
      let cut = -1;
      for(let j=end; j>i+size*0.5; j--){
        if("。！？；\n".includes(text[j])){ cut = j+1; break; }
      }
      if(cut > 0) end = cut;
    }
    const seg = text.slice(i, end).trim();
    if(seg) parts.push(seg);
    if(end >= N) break;
    i = Math.max(end - overlap, i + 1);   // 回退overlap形成重叠
  }
  return parts;
}

// 表格感知切块：把内容按"表格块 / 普通文本块"拆开，
// 表格整体保留不切断；超大表格按数据行切分，但每一块都重复表头（保证任何一块都能读懂列含义）
function ragSplitWithTables(text, prof, anchorForHeader){
  const parts = [];
  const re = /\[表格开始\]\n([\s\S]*?)\n\[表格结束\]/g;
  let last = 0, m;
  while((m = re.exec(text))){
    if(m.index > last){ const t = text.slice(last, m.index).trim(); if(t) parts.push({type:"text", content:t}); }
    parts.push({type:"table", content:m[1]});
    last = re.lastIndex;
  }
  if(last < text.length){ const t = text.slice(last).trim(); if(t) parts.push({type:"text", content:t}); }

  const out = [];
  let buf = "";
  const flushBuf = ()=>{ if(buf.trim()) out.push(buf.trim()); buf = ""; };

  parts.forEach(p=>{
    if(p.type === "text"){
      // 普通文本：能塞进当前块就塞，塞不下先收尾再按句子切
      if((buf + p.content).length <= prof.size){ buf += (buf?"\n":"") + p.content; }
      else{
        flushBuf();
        ragSplitBySentence(p.content, prof.size, prof.overlap).forEach(s=>out.push(s));
      }
      return;
    }
    // 表格
    const tableText = "[表格]\n" + p.content;
    if(tableText.length <= prof.size){
      // 整张表能装下：优先和前面的文字放一起（表格常有前置说明），装不下就单独成块
      if((buf + "\n" + tableText).length <= prof.size){ buf += (buf?"\n":"") + tableText; }
      else{ flushBuf(); out.push(tableText); }
      return;
    }
    // 超大表格：按行切，每块重复表头
    flushBuf();
    const lines = p.content.split("\n").filter(l=>l.trim());
    const header = lines.slice(0, 2).join("\n");    // 表头行 + Markdown分隔行
    const bodyLines = lines.slice(2);
    let cur = [];
    let curLen = header.length;
    bodyLines.forEach(line=>{
      if(curLen + line.length > prof.size && cur.length){
        out.push("[表格·续]\n" + header + "\n" + cur.join("\n"));
        cur = []; curLen = header.length;
      }
      cur.push(line); curLen += line.length + 1;
    });
    if(cur.length) out.push("[表格·续]\n" + header + "\n" + cur.join("\n"));
  });
  flushBuf();
  return out.length ? out : [text.slice(0, prof.size)];
}

function ragSplit(text, title, category){
  const prof = ragProfileOf(category);
  const lines = text.split(/\r?\n/);
  const chRe = /^第\s*([一二三四五六七八九十百]+)\s*[章篇]\s*[、．.:：\s]*(.*)$/;
  const secRe = /^(\d+\.\d+)\s*[、．.:：\s]*(.+)$/;
  // 政策/制度类：识别"第X条"作为独立切分点，让每条政策/标准独立成块便于精确引用
  const clauseRe = /^第\s*([一二三四五六七八九十百千0-9]+)\s*条\s*[、．.:：\s]*(.*)$/;
  // 会议纪要类：识别"议题/议程/一、"等作为切分点
  const topicRe = /^(?:议题|议程|事项)\s*[一二三四五六七八九十0-9]*\s*[、．.:：]\s*(.*)$|^[一二三四五六七八九十]+\s*[、．]\s*(.+)$/;
  const chunks = [];
  let ch="", sec="", buf=[];
  // 过短块门槛：按类型区分——政策条款、会议议题本身就可能很短，用统一80字门槛会丢内容
  const minLen = (prof.splitBy === "clause" || prof.splitBy === "topic") ? 25 : 80;
  const flush = ()=>{
    const t = buf.join("\n").trim();
    buf = [];
    if(t.length < minLen) return;   // 过短块不入库
    const anchor = "【"+title+(ch?" · "+ch:"")+(sec?" · "+sec:"")+"】\n";
    if(t.length <= prof.size){
      chunks.push({title, chapter:ch, section:sec, text: anchor + t});
    }else if(/\[表格开始\]/.test(t)){
      // 含表格的内容：表格必须整块保留（被切断会导致表头与数据分离，检索出来对不上）
      ragSplitWithTables(t, prof, anchor).forEach((seg, idx, arr)=>{
        chunks.push({title, chapter:ch, section:sec,
          text: anchor + (arr.length>1?"("+(idx+1)+"/"+arr.length+") ":"") + seg});
      });
    }else{
      const segs = ragSplitBySentence(t, prof.size, prof.overlap);
      segs.forEach((s,idx)=>{
        chunks.push({title, chapter:ch, section:sec, text: anchor + (segs.length>1?"("+(idx+1)+"/"+segs.length+") ":"") + s});
      });
    }
  };
  lines.forEach(raw=>{
    const line = raw.trim();
    let m;
    if((m=line.match(chRe)) && line.length<40){ flush(); ch=(m[2]||("第"+m[1]+"章")).trim(); sec=""; return; }
    if((m=line.match(secRe)) && line.length<45){ flush(); sec=m[2].trim(); return; }
    // 政策/制度：遇到"第X条"就切一刀，该条标题作为section
    // 注意：真实政策文件中"第X条"后常紧跟整段条文（同一行可达数百字），因此不能用行长度限制
    if(prof.splitBy === "clause" && (m=line.match(clauseRe))){
      flush();
      const head = (m[2]||"").trim().slice(0, 20);   // 取条文开头做小节名，不取全文
      sec = ("第"+m[1]+"条"+(head?" "+head:"")).trim();
      buf.push(line);   // 条款原文保留在正文里，便于引用时看到完整条文
      return;
    }
    // 会议纪要：遇到议题就切一刀（同理，议题标题后可能紧跟议题内容）
    if(prof.splitBy === "topic" && (m=line.match(topicRe))){
      flush();
      const t = (m[1]||m[2]||"").trim().slice(0, 20);
      sec = t || line.slice(0, 20);
      buf.push(line);
      return;
    }
    if(line) buf.push(line);
  });
  flush();
  return chunks;
}

        if(pd.ok && pd.verdict === "duplicate"){
          const when = pd.at ? new Date(pd.at).toLocaleDateString("zh-CN") : "";
          if(!confirm("《"+f.name+"》的内容与知识库中已有文件《"+pd.existingTitle+"》完全相同"+(when?"（"+when+"入库）":"")+"。\n\n重复入库会浪费存储、干扰检索排序。\n\n点【确定】仍然入库，点【取消】跳过此文件。")){
            failed.push(f.name+"（内容重复，已跳过）"); continue;
          }
        }else if(pd.ok && pd.verdict === "newVersion"){
          const when = pd.at ? new Date(pd.at).toLocaleDateString("zh-CN") : "";
          replaceMode = confirm("知识库中已存在同名文件《"+pd.existingTitle+"》（第"+(pd.version||1)+"版，"+(pd.chunks||0)+"块"+(when?"，"+when+"入库":"")+"）。\n\n点【确定】＝替换旧版本（删除旧内容，版本号+1，推荐）\n点【取消】＝保留旧版本并追加（可能导致新旧内容同时被检索到、互相矛盾）");
        }
      }catch(e){ /* 预检失败不阻断上传 */ }
      chunks = ragSplit(text, fileTitle, ingestCat);
      if(!chunks.length){ failed.push(f.name+"（无有效块）"); continue; }
    }catch(e){ failed.push(f.name+"（"+e.message+"）"); continue; }
    totalChunks += chunks.length;
    let assetId = "";
    try{
      const ar = await fetch("/api/materials",{method:"POST",headers:authHeaders(),body:JSON.stringify({action:"saveAsset",asset:{title:fileTitle,category:ingestCat,lifecycle:"active",doc_no:ingestDocNo,issuer:ingestIssuer,effective_date:ingestEffD,expiry_date:ingestExpD,source_ref:ingestSourceRef,content_hash:contentHash,content_text:parsedText,rag_title:fileTitle,...ingestAssetMeta}})});
      const ad = await ar.json(); if(ad.ok) assetId = ad.asset.id;
    }catch(e){ failed.push(f.name+"（资料台账登记失败）"); }
    for(let i=0; i<chunks.length; i+=10){
      prog.textContent = "《"+f.name+"》向量化入库 "+Math.min(i+10,chunks.length)+"/"+chunks.length+"（文件"+(fi+1)+"/"+files.length+"）";
      try{
        const cat = ingestCat;   // 用入库开始时锁定的分类，避免中途改动导致切块与归档分类不一致
        const lvl = document.getElementById("ragLevel")? document.getElementById("ragLevel").value : 2;
        const sec = document.getElementById("ragSec")? document.getElementById("ragSec").value : 1;
        const dept = document.getElementById("ragDept") && document.getElementById("ragDept").value.trim() ? document.getElementById("ragDept").value.trim() : "全部门";
        const r = await fetch("/api/rag",{method:"POST",headers:authHeaders(),
          body:JSON.stringify({action:"upsert", chunks:chunks.slice(i,i+10), category:cat, level:lvl, security:sec, deptScope:dept,
                               effectiveDate:ingestEffD, expiryDate:ingestExpD,
                               docNo:ingestDocNo, issuer:ingestIssuer, sourceRef:ingestSourceRef,
                               contentHash, replaceMode, isFirstBatch: i===0})});
        const d = await r.json();
        if(d.ok) okChunks += d.count; else{ failed.push(f.name+"批次"+i+"："+d.error); break; }
      }catch(e){ failed.push(f.name+"批次"+i+"：网络错误"); break; }
    }
    if(!failed.some(x=>x.startsWith(f.name+"批次")) && /\.(xlsx|xls|xlsm|csv)$/i.test(f.name)){
      try{ await indexExcelWorkbook(f, assetId, fileTitle, contentHash, prog); }
      catch(e){ failed.push(f.name+"（Excel结构化索引失败："+(e.message||"未知错误")+"）"); }
    }
  }
  prog.innerHTML = "完成：入库 "+okChunks+"/"+totalChunks+" 块" + (failed.length? '<br><span style="color:var(--red);">失败：'+esc(failed.slice(0,5).join("；"))+'</span>':'');
  refreshRagStats();
  refreshRagFiles();
}

// Excel 只把工作簿用途摘要交给 RAG；真实数字、公式和坐标写入资料台账，供精确读取和报告溯源。
async function indexExcelWorkbook(file, assetId, title, contentHash, prog){
  if(!window.XLSX) await loadScript("xlsx.full.min.js");
  const wb = XLSX.read(await file.arrayBuffer(), {cellFormula:true, cellNF:true, cellText:true, cellDates:true});
  const cr = await fetch("/api/materials",{method:"POST",headers:authHeaders(),body:JSON.stringify({action:"createWorkbook",title,filename:file.name,assetId,contentHash})});
  const cd = await cr.json(); if(!cd.ok) throw new Error(cd.error||"无法创建工作簿索引");
  for(let si=0;si<wb.SheetNames.length;si++){
    const name=wb.SheetNames[si], ws=wb.Sheets[name], range=ws["!ref"]; if(!range) continue;
    const r=XLSX.utils.decode_range(range), headers=[];
    for(let c=r.s.c;c<=r.e.c;c++){ const h=ws[XLSX.utils.encode_cell({r:r.s.r,c})]; headers.push(h?String(h.w??h.v??"").slice(0,100):""); }
    const cells=[];
    for(let row=r.s.r;row<=r.e.r;row++) for(let col=r.s.c;col<=r.e.c;col++){
      const addr=XLSX.utils.encode_cell({r:row,c:col}), cell=ws[addr]; if(!cell || (cell.v===undefined&&!cell.f)) continue;
      cells.push({address:addr,row_idx:row+1,col_idx:col+1,raw_value:String(cell.v??""),display_value:String(cell.w??cell.v??""),formula:String(cell.f||""),data_type:String(cell.t||"")});
    }
    if(cells.length>30000) throw new Error("单个 Sheet 非空单元格超过30000，请拆分工作簿后再入库");
    prog.textContent="《"+file.name+"》结构化索引："+name+"（"+cells.length+"个非空单元格）…";
    const sr=await fetch("/api/materials",{method:"POST",headers:authHeaders(),body:JSON.stringify({action:"saveSheet",workbookId:cd.workbookId,sheet:{name,sheet_index:si,used_range:range,headers,row_count:r.e.r-r.s.r+1,col_count:r.e.c-r.s.c+1}})});
    const sd=await sr.json(); if(!sd.ok) throw new Error(sd.error||"无法保存 Sheet");
    for(let i=0;i<cells.length;i+=500){ const rr=await fetch("/api/materials",{method:"POST",headers:authHeaders(),body:JSON.stringify({action:"saveCells",sheetId:sd.sheetId,cells:cells.slice(i,i+500)})}); const rd=await rr.json(); if(!rd.ok) throw new Error(rd.error||"无法保存单元格"); }
  }
}

// 知识时效：徽章显示（过期/待生效/临近失效/长期有效）
function ragLifeStatus(effDate, expDate){
  const today = new Date().toISOString().slice(0,10);
  // 非法日期一律按"未设置"处理，避免脏数据导致误判为未生效/已失效
  const norm = (s)=>{ s = String(s||"").trim(); return /^\d{4}-\d{2}-\d{2}$/.test(s) && !isNaN(new Date(s)) ? s : ""; };
  const eff = norm(effDate), exp = norm(expDate);
  if(exp && exp < today) return { key:"expired", label:"已失效", color:"#B7302B", bg:"#FDECEA", tip:"失效于"+exp };
  if(eff && eff > today) return { key:"pending", label:"未生效", color:"#8A6D1B", bg:"#FFF8E1", tip:eff+"起生效" };
  if(exp){
    const d = (new Date(exp) - new Date(today)) / 86400000;
    if(d >= 0 && d <= 30) return { key:"expiring", label:"即将失效", color:"#C77700", bg:"#FFF3E0", tip:exp+"失效" };
    return { key:"valid", label:"", color:"", bg:"", tip:"有效至"+exp };
  }
  return { key:"valid", label:"", color:"", bg:"", tip:"长期有效" };
}
function ragLifeBadge(effDate, expDate){
  const s = ragLifeStatus(effDate, expDate);
  if(!s.label) return '';
  return '<span title="'+esc(s.tip)+'" style="font-size:11px; padding:1px 7px; border-radius:3px; background:'+s.bg+'; color:'+s.color+';">'+s.label+'</span>';
}

  return ' <span style="font-size:11px; padding:0 6px; border-radius:3px; background:#F3F4F6; color:#888;">低匹配</span>';
}

  try{
    const r = await fetch("/api/rag",{method:"POST",headers:authHeaders(),body:JSON.stringify({action:"graph"})});
    const d = await r.json();
    if(!d.ok){ box.innerHTML = esc(d.error||"不可用"); return; }
    const g = d.graph||{nodes:[],edges:[]};
    if(!g.nodes.length){ box.innerHTML = '<span style="color:var(--soft);">暂无启用的文件可构建关联图</span>'; return; }
    const W=680, H=440, cx=W/2, cy=H/2, R=Math.min(W,H)/2-60;
    const n = g.nodes.length;
    const CATC = new Proxy({}, { get:(t,k)=> ragCatColor(String(k)) });   // 配色统一从分类数据源取
    // 同类节点聚在相近角度
    const cats = [...new Set(g.nodes.map(x=>x.category))];
    const pos = g.nodes.map((nd,i)=>{
      const ci = cats.indexOf(nd.category);
      const inCat = g.nodes.filter(x=>x.category===nd.category);
      const idxInCat = inCat.indexOf(nd);
      const baseAng = (ci/cats.length)*2*Math.PI;
      const spread = (idxInCat - (inCat.length-1)/2) * 0.18;
      const ang = baseAng + spread;
      return {x: cx+R*Math.cos(ang), y: cy+R*Math.sin(ang)};
    });
    let svg = '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%; height:auto; border:1px solid var(--line); background:#fff;">';
    // 边
    g.edges.forEach(e=>{
      const a=pos[e.source], b=pos[e.target];
      svg += '<line x1="'+a.x.toFixed(0)+'" y1="'+a.y.toFixed(0)+'" x2="'+b.x.toFixed(0)+'" y2="'+b.y.toFixed(0)+'" stroke="#ccc" stroke-width="'+Math.min(e.weight,3)+'"/>';
    });
    // 节点
    g.nodes.forEach((nd,i)=>{
      const p=pos[i]; const c=CATC[nd.category]||"#888";
      const rad = nd.level===1? 8 : nd.level===3? 4 : 6;
      svg += '<circle cx="'+p.x.toFixed(0)+'" cy="'+p.y.toFixed(0)+'" r="'+rad+'" fill="'+c+'"><title>'+esc(nd.title)+' ['+esc(nd.category)+']</title></circle>';
      const short = nd.title.length>8? nd.title.slice(0,8)+"…" : nd.title;
      svg += '<text x="'+p.x.toFixed(0)+'" y="'+(p.y-rad-3).toFixed(0)+'" text-anchor="middle" style="font-size:9px; fill:#555;">'+esc(short)+'</text>';
    });
    svg += '</svg>';
    let legend = '<div style="font-size:11px; margin-top:6px;">分类：'+cats.map(c=>'<span style="color:'+(CATC[c]||"#888")+';">●</span>'+esc(c)).join("　")+'</div>';
    box.innerHTML = '<div style="border:1px solid var(--line); background:#fff; padding:12px 14px;"><div style="font-weight:600; margin-bottom:8px;">🕸 知识关联图</div>'
      +'<div style="font-size:11px; color:var(--soft); margin-bottom:8px;">节点=文档（大小按权威等级），连线=同分类或标题含共同关键词。鼠标悬停看完整标题。规模较大时仅展示前60个文档。</div>'
      + svg + legend + '</div>';
  }catch(e){ box.innerHTML = "构建失败"; }
}

async function ragEvalRender(){

    html += '<div style="font-weight:600; margin-bottom:6px;">🎯 检索评测（标准问答集）</div>';
    html += '<div style="font-size:11px; color:var(--soft); margin-bottom:10px;">基于你熟悉的真实文档，出几道"搜XX词应该命中XX文件"的标准题，一键跑分，持续验证检索准确率（尤其在改切块参数、调整加权系数之后，用它确认没有变差）。</div>';
    html += '<div style="display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px;">'
      +'<input id="evQ" placeholder="检索词，如：市场供需分析" style="flex:1; min-width:160px;">'

      +'<input id="evNote" placeholder="备注(选填)" style="flex:1; min-width:100px;">'
      +'<button class="btn sm" id="evAdd">添加</button></div>';
    if(cases.length){
      html += '<table class="tbl" style="width:100%; font-size:12px; margin-bottom:10px;"><tr><th style="text-align:left;">检索词</th><th style="text-align:left;">应命中文件</th><th>操作</th></tr>';
      cases.forEach(c=>{ html += '<tr><td>'+esc(c.query)+'</td><td>'+esc(c.expect_title)+'</td><td style="text-align:center;"><a href="javascript:void(0)" class="ev-del" data-id="'+c.id+'" style="color:var(--red);">删除</a></td></tr>'; });
      html += '</table><button class="btn" id="evRun">▶ 运行评测（'+cases.length+'条）</button>';
    }else{
      html += '<div style="color:var(--soft); font-size:12px;">暂无标准问答，先添加几条再运行评测。</div>';
    }
    html += '<div id="evReport" style="margin-top:12px;"></div></div>';
    box.innerHTML = html;

    document.getElementById("evAdd").onclick = async ()=>{
      const q = document.getElementById("evQ").value.trim();
      const et = document.getElementById("evTitle").value.trim();
      const note = document.getElementById("evNote").value.trim();
      if(!q || !et){ msg("检索词与应命中文件标题都要填","err"); return; }
      const r = await fetch("/api/rag",{method:"POST",headers:authHeaders(),body:JSON.stringify({action:"evalAdd", query:q, expectTitle:et, note})});
      const d = await r.json();
      if(d.ok){ msg("已添加","ok"); ragEvalRender(); } else msg(d.error||"添加失败","err");
    };
    box.querySelectorAll(".ev-del").forEach(a=>{
      a.onclick = async ()=>{
        await fetch("/api/rag",{method:"POST",headers:authHeaders(),body:JSON.stringify({action:"evalDelete", id:parseInt(a.dataset.id)})});
        ragEvalRender();
      };
    });
    const runBtn = document.getElementById("evRun");
    if(runBtn) runBtn.onclick = async ()=>{
      runBtn.disabled = true; runBtn.textContent = "评测运行中…";
      const rep = document.getElementById("evReport");
      rep.innerHTML = '<span style="color:var(--soft);">正在逐条检索比对…</span>';
      try{
        const r = await fetch("/api/rag",{method:"POST",headers:authHeaders(),body:JSON.stringify({action:"evalRun"})});
        const d = await r.json();
        if(!d.ok){ rep.innerHTML = esc(d.error||"评测失败"); return; }
        const rp = d.report;
        const color = rp.accuracy>=80? "#1F7A3D" : rp.accuracy>=60? "#8A6D1B" : "#B7302B";
        let h = '<div style="border-top:2px solid var(--line); padding-top:10px;">';
        h += '<div style="font-size:15px; font-weight:700; color:'+color+';">检索准确率：'+rp.accuracy+'%　（'+rp.hit+'/'+rp.total+' 命中）'+(rp.avgRank?'　平均命中排名第'+rp.avgRank+'位':'')+'</div>';
        h += '<table class="tbl" style="width:100%; font-size:12px; margin-top:8px;"><tr><th style="text-align:left;">检索词</th><th style="text-align:left;">应命中</th><th>结果</th><th style="text-align:left;">实际返回前5</th></tr>';
        rp.results.forEach(x=>{
          h += '<tr><td>'+esc(x.query)+'</td><td>'+esc(x.expectTitle)+'</td>'
            +'<td style="text-align:center; color:'+(x.hit?"#1F7A3D":"#B7302B")+';">'+(x.hit?"✓第"+x.rank+"位":"✗未命中")+'</td>'
            +'<td style="color:var(--soft); font-size:11px;">'+esc((x.topTitles||[]).join("；"))+'</td></tr>';
        });
        h += '</table></div>';
        rep.innerHTML = h;
      }catch(e){ rep.innerHTML = "评测请求失败"; }
      runBtn.disabled = false; runBtn.textContent = "▶ 运行评测";
    };
  }catch(e){ box.innerHTML = "加载失败"; }
}

/* 一/二/三(doc 1-18号)是一次性算出的数，按no前缀（如"5.1"是"5"的子项）建一棵可折叠的树；
   目前只在测算结果页的"投资估算大纲"里真正参与展示，这里仅供后台浏览/编写参考说明，不写入Excel/Word导出 */
function estimateOutlineHtml(){
  const rows = window.CALC_ESTIMATE_OUTLINE || [];
  if(!rows.length) return "";
  const map = {}; const roots = [];
  rows.forEach(r=>{ map[r.no] = Object.assign({}, r, {level:(r.no.match(/\./g)||[]).length, children:[]}); });
  rows.forEach(r=>{
    const parts = r.no.split(".");
    if(parts.length===1){ roots.push(map[r.no]); return; }
    const parentNo = parts.slice(0,-1).join(".");
    if(map[parentNo]) map[parentNo].children.push(map[r.no]); else roots.push(map[r.no]);
  });
  const renderNode = node=>{
    const head = '<span style="font-family:var(--mono); color:var(--soft); font-size:11px;">'+node.no+'.</span> '
      +'<b style="font-size:12.5px;">'+esc(node.label)+'</b>'
      +(node.hint? '　<span style="font-size:11.5px; color:var(--soft);">'+esc(node.hint)+'</span>' : "");
    const textarea = '<textarea data-clestdesc="'+node.no+'" placeholder="补充说明（可选）" style="display:block; margin-top:4px; min-height:32px; width:100%; box-sizing:border-box; font-size:12px;">'+esc((clLogic[clType]&&clLogic[clType]["est:"+node.no])||"")+'</textarea>';
    if(!node.children.length){
      return '<div style="padding:6px 0 6px '+(node.level*16)+'px; border-bottom:1px dashed var(--line);">'+head+textarea+'</div>';
    }
    return '<details style="margin-left:'+(node.level*16)+'px;"><summary style="padding:6px 0; border-bottom:1px dashed var(--line); cursor:pointer;">'+head+'</summary>'
      + '<div style="padding:2px 0 6px 0;">'+textarea+'</div>'
      + '<div>'+node.children.map(renderNode).join("")+'</div></details>';
  };
  return '<div class="sub" style="margin-top:18px;">一、技术指标 + 二、投资估算 + 三、工期进度（doc 1-18号）——这部分是一次性算出的数，不按年份分列，<b>目前只在测算结果页的"投资估算大纲"里展示，还没有计入Excel/Word文件导出</b>。这里仅供浏览与预留说明文字。</div>'
    + '<div style="margin-top:8px;">' + roots.map(renderNode).join("") + '</div>';
}

/* 用「测算参数管理」页已配置的系数(CALC_CFG.gaibao/rent/sale) + 各表单默认值跑一次示例测算，

   保证这里点出来的文件和用户在主应用里点"导出"看到的结构、公式完全一致——不是另外拼一份假数据。 */
async function generateSampleExport(kind){
  const type = clType;
  readClForm();
  const btnId = kind==="word"? "genSampleWord" : "genSampleExcel";
  const btn = document.getElementById(btnId);
  const tip = document.getElementById("genSampleMsg");
  if(btn){ btn.disabled = true; }
  if(tip){ tip.textContent = "生成中…"; tip.style.color = "var(--soft)"; }
  try{
    if(typeof CALC_CFG === "undefined" || !window.RentCalc || !window.NRCalc || !window.SaleCalc || typeof runCalcEngine !== "function"){
      throw new Error("测算引擎脚本未加载");
    }
    // 拉一次后台已保存的测算参数系数(gaibao/rent/sale)，示例文件的系数跟"测算参数管理"页保持一致
    let baseCfg = {gaibao:{}, rent:{}, sale:{}, metrics:[], score:[], examples:[], airules:[], calclogic:{}};
    try{
      const r = await fetch("/api/calcconfig", {headers:authHeaders()});
      const d = await r.json();
      if(d.ok && d.config) baseCfg = Object.assign(baseCfg, d.config);
    }catch(e){}
    // calclogic用当前页面正在编辑的内容覆盖（含未保存的），其余系数用后台已保存值
    baseCfg.calclogic = clLogic;
    CALC_CFG = baseCfg;

    calcType = type;
    scParams = null;
    const off = document.createElement("div");
    off.style.cssText = "position:absolute; left:-99999px; top:0; width:0; height:0; overflow:hidden;";
    off.innerHTML = type==="gaibao"? calcFormHtml() : type==="sale"? saleFormHtml() : rentFormHtml();
    document.body.appendChild(off);
    let params;
    try{
      params = type==="gaibao"? readCalcForm() : type==="sale"? readSaleForm() : readRentForm();
    }finally{
      document.body.removeChild(off);
    }
    scParams = params;
    scResult = runCalcEngine(type, params);

    if(kind==="excel") await exportCalcExcel(); else await exportCalcWord();
    if(tip){ tip.textContent = "已生成，请在浏览器下载中查看"; tip.style.color = "var(--ok)"; }
  }catch(e){
    if(tip){ tip.textContent = "生成失败："+e.message; tip.style.color = "var(--red)"; }
  }
  if(btn){ btn.disabled = false; }
}

/* ---- 敏感性分析(蒙特卡洛/Sobol)：用真实引擎+当前已保存系数，找出哪些填空参数真正决定IRR ----

   每次运行会和"上一次跑这个类型"的结果(存localStorage)自动对比排名变化，方便改完系数后核对影响。 */
const SENS_METHOD_DEFS = [
  {v:"sobol", label:"Sobol方差分解", hint:"能识别参数间交互效应，成本最高"},
  {v:"spearman", label:"Spearman秩相关", hint:"只看该参数和IRR的单调关系，成本最低"},

// 结果对象结构每改一次(比如这次新增methods字段)，之前存在localStorage里的旧格式缓存就读不出来了——
// 靠这个版本号识别，版本不对的缓存直接当作没有，不强行渲染旧数据去崩页面
const SENS_CACHE_VERSION = 3;
function loadSensCache(type){
  let prev=null;
  try{ prev = JSON.parse(localStorage.getItem("sens_"+type)||"null"); }catch(e){ prev=null; }
  if(!prev || prev.cacheVersion!==SENS_CACHE_VERSION || !Array.isArray(prev.methods) || !Array.isArray(prev.table)){
    if(prev) localStorage.removeItem("sens_"+type); // 清掉认不出的旧缓存，下次不用再判断
    return null;
  }
  return prev;
}
function saveSensCache(type, result){
  result.cacheVersion = SENS_CACHE_VERSION;
  localStorage.setItem("sens_"+type, JSON.stringify(result));
}

function sensTableHtml(result, prevForDiff){
  if(!result || !Array.isArray(result.methods) || !Array.isArray(result.table)){
    return '<div class="empty">这条结果的数据格式对不上(可能是旧版本缓存)，请重新点"运行分析"</div>';
  }
  if(prevForDiff && (!Array.isArray(prevForDiff.methods) || !Array.isArray(prevForDiff.table))) prevForDiff = null;
  const hasMulti = result.methods.length>1;
  const rows = result.table.map((r,i)=>{
    let deltaHtml = "";
    if(prevForDiff){
      const prevIdx = prevForDiff.table.findIndex(x=>x.key===r.key);
      if(prevIdx<0) deltaHtml = '<span style="color:var(--bp);">新增</span>';
      else{
        const d = prevIdx - i;
        deltaHtml = d===0? '<span style="color:var(--soft);">–</span>'
          : (d>0? '<span style="color:var(--ok,#2E7D46);">↑'+d+'</span>' : '<span style="color:var(--red);">↓'+(-d)+'</span>');
      }
    }
    let cells = '<td>'+(i+1)+'</td><td>'+esc(r.key)+'</td><td style="text-align:left;">'+esc(r.label||"")+'</td><td>'+esc(r.group)+'</td><td><b>'+esc(r.impactLabel||"未分级")+'</b></td>';
    if(result.methods.includes("sobol")) cells += '<td>'+(r.Si!==null?r.Si.toFixed(4):"—")+'</td><td>'+(r.STi!==null?r.STi.toFixed(4):"—")+'</td>';
    if(result.methods.includes("spearman")) cells += '<td>'+(r.spearmanRho!==null&&r.spearmanRho!==undefined?r.spearmanRho.toFixed(4):"—")+'</td>';
    if(result.methods.includes("src")) cells += '<td>'+(r.src!==null&&r.src!==undefined?r.src.toFixed(4):"—")+'</td>';
    if(hasMulti) cells += '<td><b>'+(r.combinedRank!==null?r.combinedRank:"—")+'</b></td>';
    if(prevForDiff) cells += '<td>'+deltaHtml+'</td>';
    return '<tr>'+cells+'</tr>';
  }).join("");
  let head = '<th>排名</th><th>参数</th><th>具体指标</th><th>分组</th><th>影响等级</th>';
  if(result.methods.includes("sobol")) head += '<th>Si(一阶)</th><th>STi(总效应)</th>';
  if(result.methods.includes("spearman")) head += '<th>Spearman秩相关</th>';
  if(result.methods.includes("src")) head += '<th>标准化回归系数</th>';
  if(hasMulti) head += '<th>综合名次</th>';
  if(prevForDiff) head += '<th>较上次综合排名变化</th>';
  const methodsStr = result.methods.map(m=>(SENS_METHOD_DEFS.find(x=>x.v===m)||{}).label||m).join(" + ");
  return '<div style="font-size:12px; color:var(--soft); margin-bottom:6px;">'+result.label+' · N='+result.N+' · '+result.K+'个参数 · 方法：'+esc(methodsStr)+' · 耗时'+result.elapsedSec.toFixed(1)+'s'
    + (result.savedAt? ' · 运行于 '+new Date(result.savedAt).toLocaleString("zh-CN") : "") + '</div>'
    +'<table class="tbl" style="width:100%;"><tr>'+head+'</tr>' + rows + '</table>';
}
/* 用analyzeAsync而不是analyze：出租类51个参数、N=1500、3个方法全选时约8万次模型评估，
   同步跑会把主线程堵住一分钟以上，标签页在这期间对任何点击都没反应(看起来像"点不动"，其实是在算，
   之前反馈的"出租类点不动"根源就在这)。异步版每约100次评估让出一次主线程，全程能响应点击、能看到进度。 */
let sensRunning = false;
function setSensControlsDisabled(disabled){
  const ids = ["sensN"];
  ids.forEach(id=>{ const el=document.getElementById(id); if(el) el.disabled = disabled; });
  document.querySelectorAll(".sensMethod, [data-senstype]").forEach(el=>{ el.disabled = disabled; });
}
async function runSensitivity(){
  if(sensRunning) return;
  const btn = document.getElementById("runSens");
  const status = document.getElementById("sensStatus");
  const N = parseInt(document.getElementById("sensN").value, 10);
  const methods = [...document.querySelectorAll(".sensMethod:checked")].map(el=>el.value);
  if(!window.SensitivityCore || !SensitivityCore.analyzeAsync){ status.textContent = "敏感性分析脚本未加载或版本过旧(sensitivity-core.js)，请强制刷新页面(Ctrl+Shift+R)后重试"; return; }
  if(!methods.length){ status.textContent = "请至少勾选一个方法"; return; }
  sensRunning = true;
  btn.disabled = true; btn.textContent = "■ 运行中，点击停止无效，请等待…";
  setSensControlsDisabled(true);
  status.textContent = "运行中…(N="+N+"，方法："+methods.length+"个)";
  try{
    const cfg = {gaibao:calcCfg.gaibao||{}, rent:calcCfg.rent||{}, sale:calcCfg.sale||{}, invest:calcCfg.invest||{}};
    const result = await SensitivityCore.analyzeAsync(clType, methods, N, cfg, undefined, (p)=>{
      status.textContent = p.stage==="sobol参数"
        ? "运行中…Sobol 参数 "+p.index+"/"+p.total+"："+(p.label||p.key)
        : "运行中…"+p.stage+" "+p.done+"/"+p.total;
    });
    result.table = ParamGovernance.classifyParameters(result.table);
    const prev = loadSensCache(clType);
    result.savedAt = Date.now();
    document.getElementById("sensResult").innerHTML = sensTableHtml(result, prev);
    saveSensCache(clType, result);
    status.textContent = "完成，同步到服务端…";
    // 同步一份到服务端(configs表)：本地localStorage只有跑分析的这台浏览器能看到，
    // 但/api/aireport的参数推荐(doSuggest)跑在Worker里，要用这份结果替换手工维护的关键参数短名单，
    // 必须能从服务端读到——失败不影响本地这次分析结果的展示，只是没同步成功，下次跑成功了自然会补上。
    try{
      calcCfg.sensitivity = Object.assign({}, calcCfg.sensitivity, { [clType]: result });
      const sr = await fetch("/api/calcconfig",{method:"POST",headers:authHeaders(),
        body:JSON.stringify({key:"sensitivity", data:calcCfg.sensitivity})});
      const sd = await sr.json();
      status.textContent = sd.ok ? "完成，已同步到服务端" : "完成，但同步服务端失败："+(sd.error||"未知错误");
    }catch(e){
      status.textContent = "完成，但同步服务端失败（网络错误）";
    }
  }catch(e){
    status.textContent = "失败："+e.message;
  }
  sensRunning = false;
  btn.disabled = false; btn.textContent = "▶ 运行分析";
  setSensControlsDisabled(false);
}

function readCsForm(){
  const rows = [...document.querySelectorAll(".cs-row")];
  csList = rows.map(row=>{
    const i = +row.dataset.csi;
    const orig = csList[i] || {};   // 保留未在表单里展示的字段(id/paramKey/tiers等)，不因编辑其他字段而丢失
    const category = row.querySelector(".cs-category").value.trim();
    const item = row.querySelector(".cs-item").value.trim();
    const standard = row.querySelector(".cs-standard").value.trim();
    const checkType = row.querySelector(".cs-checktype").value;
    const calcType = row.querySelector(".cs-calctype").value.trim() || "all";
    const rawValue = row.querySelector(".cs-value").value.trim();
    const note = row.querySelector(".cs-note").value.trim();
    const reason = row.querySelector(".cs-reason").value.trim();
    const wikiId=row.querySelector(".cs-wiki").value, page=arWikiPages.find(p=>p.id===wikiId);
    const evidenceRefs=page?[{id:page.id,title:page.title,version:page.version||0,sourceRef:page.source_ref||""}]:[];
    const value = rawValue==="" ? undefined : (isNaN(Number(rawValue)) ? rawValue : Number(rawValue));
    return Object.assign({}, orig, {id:orig.id||("CS-"+String(i+1).padStart(3,"0")),category, item, standard, checkType, calcType, value, note, reason, evidenceRefs});
  }).filter(e=>e.category || e.item || e.standard);
}
async function saveCalcStd(){
  readCsForm();
  const btn = document.getElementById("saveCs");
  btn.disabled=true; btn.textContent="保存中…";
  try{
    const r = await fetch("/api/calcconfig",{method:"POST",headers:authHeaders(),
      body:JSON.stringify({key:"calcstd", data:csList})});
    const d = await r.json();
    if(d.ok){ msg("测算审核标准已保存","ok"); stdEditUnlocked=false; renderCalcStd(); return; }
    else msg(d.error||"保存失败","err");
  }catch(e){ msg("网络错误","err"); }
  btn.disabled=false; btn.textContent="保存标准";
}

function scheduleCfgWorking(type){

  const working=calcCfg.schedule.types[type],base=Math.max(1,Math.round(Number(working.template&&working.template.baseQuarters)||16));
  if(type==="sale"){
    const priorSales=(working.template&&working.template.tasks||[]).find(t=>t.id==="sales"),buildQuarters=Math.max(1,Math.round(Number(working.buildQuarters)||(priorSales?Number(priorSales.startQuarterNo)-1:Math.min(base,16))||16));working.buildQuarters=buildQuarters;working.template=InvestmentSchedule.ensureSaleTemplate(working.template,buildQuarters);
    if(!Array.isArray(working.coefficientRows))working.coefficientRows=InvestmentSchedule.clone(InvestmentSchedule.SALE_COEFFICIENT_ROWS);
    InvestmentSchedule.SALE_COEFFICIENT_ROWS.forEach(def=>{if(!working.coefficientRows.some(r=>r.no===def.no))working.coefficientRows.push(InvestmentSchedule.clone(def));});
  }
  (working.template&&working.template.tasks||[]).forEach(t=>{
    const oldRatioDefault=!Object.prototype.hasOwnProperty.call(t,"durationQuarters")&&Number(t.durationRatio)===.42;
    const oldRoundedDefault=Number(t.startQuarterNo)===5&&Number(t.durationQuarters)===7&&(Number(t.durationRatio)===.4375||Number(t.durationRatio)===.42);

  });
  return working;
}

function pgParseExpertValue(raw,type){
  if(type==="number"){ const n=Number(raw); return Number.isFinite(n)?n:null; }
  if(type==="array") return raw.split(/[,，\s]+/).map(x=>Number(x)).filter(Number.isFinite);
  if(type==="boolean") return /^(true|1|是)$/i.test(raw);
  return raw;
}

  /* ===== 运维看板：今日AI调用量占全站上限比例 + 本地部署向量化缓存命中率/Ollama耗时 =====
     数据全部来自真实统计（usage_counters表原子计数、ai-ollama.js进程内累计），不是摆设面板；
     向量化缓存那块只有本地部署才有意义，云端环境用的是Cloudflare Workers AI原生绑定，
     没有_cacheStats()这个自定义方法，接口会如实返回null，这里显示"云端环境不适用"而不是报错。 */
  window.openStats = async function(){
    const box=document.getElementById("listBox");
    document.getElementById("editBox").style.display="none";
    box.style.display="block";
    box.innerHTML='<div class="stat-page"><div style="display:flex; justify-content:space-between; align-items:center;">'
      +'<div><div class="stat-page-title">📊 运维看板</div>'
      +'<div class="sub" style="margin-bottom:0; margin-top:4px;">今日AI调用量、本地部署RAG向量化缓存命中率与Ollama响应耗时——排查"是不是快到额度上限了/缓存有没有在起作用/响应是不是变慢了"用。</div></div>'
      +'<button class="btn sm ghost" id="statsRefresh" style="flex-shrink:0; margin-left:16px;">↻ 刷新</button></div>'
      +'<div id="statsBox" style="margin-top:16px;">加载中…</div></div>';
    document.getElementById("statsRefresh").onclick = refreshStats;
    await refreshStats();
  };
  async function refreshStats(){
    const el = document.getElementById("statsBox"); if(!el) return;
    el.innerHTML = '<div class="empty">加载中…</div>';
    try{
      const r = await fetch("/api/stats", {headers: authHeaders()});
      const d = await r.json();
      if(!d.ok){ el.innerHTML = '<div class="msg err">'+esc(d.error||"读取失败")+'</div>'; return; }

      const pct = d.limits.global? Math.min(100, Math.round(d.globalToday/d.limits.global*1000)/10) : 0;
      const level = pct>=90? "err" : pct>=70? "warn" : "ok";
      const levelText = pct>=90? "接近上限" : pct>=70? "偏高" : "正常";
      const barColor = level==="err"? "var(--red)" : level==="warn"? "#C99A2E" : "var(--ok)";

      let h = '<div class="stat-grid">';
      // ---- 卡片1：今日AI调用量 ----
      h += '<div class="stat-card">'
        + '<div class="stat-label">📈 今日AI调用量 · '+esc(d.today)+'</div>'
        + '<div class="stat-num">'+d.globalToday+'<span class="unit">/ 全站上限 '+d.limits.global+'</span></div>'
        + '<div class="stat-bar-track"><div class="stat-bar-fill" style="width:'+pct+'%; background:'+barColor+';"></div></div>'
        + '<div><span class="stat-badge '+level+'">'+pct+'% · '+levelText+'</span></div>'
        + '<div class="stat-foot">单用户每日额度：日常问答 '+d.limits.chat+' 次　·　报告生成/批量评审 '+d.limits.batch+' 次</div>'
        + '</div>';
      // ---- 卡片2：今日调用量前十用户 ----
      const topRows = (list)=> (list&&list.length)
        ? list.map(u=>'<div class="stat-mini-row"><span class="stat-mini-label">用户 #'+esc(u.userId)+'</span><span class="stat-mini-val">'+u.cnt+' 次</span></div>').join("")
        : '<div class="stat-mini-row"><span class="stat-mini-label">（今日暂无）</span></div>';
      h += '<div class="stat-card">'
        + '<div class="stat-label">👥 今日调用量前十用户</div>'
        + '<div class="stat-mini-head">日常问答</div>' + topRows(d.topChatUsers)
        + '<div class="stat-mini-head">报告生成/批量评审</div>' + topRows(d.topBatchUsers)
        + '</div>';
      h += '</div>';
      if(d.usageError) h += '<div class="msg err" style="margin-top:14px;">'+esc(d.usageError)+'</div>';

      // ---- 卡片3：本地部署向量化缓存与Ollama耗时（整行宽度） ----
      h += '<div class="stat-card" style="margin-top:16px;"><div class="stat-label">⚡ 本地部署 · RAG向量化缓存与Ollama耗时</div>';
      if(!d.vectorCache){
        h += '<div class="stat-foot" style="margin-top:8px;">云端环境不适用（Cloudflare Workers AI原生绑定没有这个统计）。</div>';
      }else{
        const vc = d.vectorCache;
        const hrLevel = vc.hitRate==null? null : vc.hitRate>=50? "ok" : vc.hitRate>=20? "warn" : null;
        h += '<div class="stat-kpi-row">'
          + '<div class="stat-kpi"><div class="stat-label">缓存命中率</div><div class="stat-num">'+(vc.hitRate!=null?vc.hitRate+"%":"—")+'</div>'
            + (hrLevel? '<span class="stat-badge '+hrLevel+'">'+(hrLevel==="ok"?"起作用了":"逐步生效")+'</span>' : '')+'</div>'
          + '<div class="stat-kpi"><div class="stat-label">命中 / 未命中</div><div class="stat-num" style="font-size:18px;">'+vc.hits+' / '+vc.misses+'</div></div>'
          + '<div class="stat-kpi"><div class="stat-label">缓存条目数</div><div class="stat-num" style="font-size:18px;">'+vc.cacheSize+'<span class="unit">/ '+vc.cacheMax+'</span></div></div>'
          + '<div class="stat-kpi"><div class="stat-label">Ollama平均耗时</div><div class="stat-num">'+(vc.avgLatencyMs!=null?vc.avgLatencyMs:"—")+'<span class="unit">'+(vc.avgLatencyMs!=null?"ms":"")+'</span></div></div>'
          + '</div><div class="stat-foot">以上是本地服务器进程启动以来的累计值，重启后清零；不是持久化的历史趋势数据。</div>';
      }
      h += '</div>';
      el.innerHTML = h;
    }catch(e){
      el.innerHTML = '<div class="msg err">网络错误：'+esc(e.message)+'</div>';
    }
  }

  /* ===== 历史项目案例库：审核用户提交的测算案例 ===== */
  window.openCalcCases = async function(){
    const box=document.getElementById("listBox");
    document.getElementById("editBox").style.display="none";
    box.style.display="block";
    box.innerHTML='<div class="card"><b>历史项目案例库</b><div class="hint">用户完成测算后可提交案例，经确认后进入案例库，供其他人载入参数复算。</div><div id="caseBox" style="margin-top:12px;">加载中…</div></div>';
    await refreshCases();
  };
  async function refreshCases(){
    const el=document.getElementById("caseBox"); if(!el) return;
    try{
      const [pr,cr]=await Promise.all([
        fetch("/api/calccases?status=pending",{headers:authHeaders()}).then(r=>r.json()),
        fetch("/api/calccases?status=confirmed",{headers:authHeaders()}).then(r=>r.json()),
      ]);
      let h="";
      const table=(list,isPending)=>{
        if(!list.length) return '<div class="hint">（无）</div>';
        let t='<table class="tbl"><tr><th>项目名称</th><th>类型</th><th>地点</th><th>IRR</th><th>提交人</th><th>时间</th><th>操作</th></tr>';
        list.forEach(it=>{
          const s=it.summary||{}, d=new Date(it.created_at);
          t+='<tr><td>'+esc(it.name)+'</td><td>'+esc(it.typeCn||"")+'</td><td>'+esc(it.location||"—")+'</td>'
            +'<td>'+(s.irr!=null?s.irr+"%":"—")+'</td><td>'+esc(it.username||"—")+'</td>'
            +'<td>'+d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")+'</td><td>'
            +(isPending
              ? '<button class="btn sm" data-okcase="'+it.id+'">确认入库</button> <button class="btn sm" data-nocase="'+it.id+'">退回</button>'
              : '<button class="btn sm" data-delcase="'+it.id+'">删除</button>')
            +'</td></tr>';
        });
        return t+'</table>';
      };
      h+='<div style="font-weight:600; margin:6px 0;">待确认（'+((pr.list||[]).length)+'）</div>'+table(pr.list||[], true);
      h+='<div style="font-weight:600; margin:16px 0 6px;">已入库（'+((cr.list||[]).length)+'）</div>'+table(cr.list||[], false);
      el.innerHTML=h;
      const act=async (id,body,method)=>{
        await fetch("/api/calccases?id="+id,{method:method||"PATCH",
          headers:Object.assign({"Content-Type":"application/json"},authHeaders()),
          body:body?JSON.stringify(body):undefined});
        refreshCases();
      };
      el.querySelectorAll("[data-okcase]").forEach(b=>b.onclick=()=>act(b.dataset.okcase,{action:"confirm"}));
      el.querySelectorAll("[data-nocase]").forEach(b=>b.onclick=()=>act(b.dataset.nocase,{action:"reject"}));
      el.querySelectorAll("[data-delcase]").forEach(b=>b.onclick=()=>{
        if(confirm("确定删除该案例？")) act(b.dataset.delcase,null,"DELETE"); });
    }catch(e){ el.textContent="加载失败："+e.message; }
  }

  /* ===== 人口参考表：街道/乡镇人口没有官方免费API，只能人工整理真实统计公报数据 =====
     AI可研生成对话时会按"地点文本"模糊匹配这张表（命中区/街道才算数，只命中市不够精确），
     查不到就照实说"未收录"，不会拿这张表凑不出的数字去猜。 */
  window.openPopulation = async function(){
    const box=document.getElementById("listBox");
    document.getElementById("editBox").style.display="none";
    box.style.display="block";
    box.innerHTML='<div class="card"><b>人口参考表</b>'
      +'<div class="hint">供"AI可研生成"对话时自动查询常住人口。请只录入能查到官方来源（统计局公报/统计年鉴）的真实数据，不确定的宁可不录——查不到时系统会照实告知"未收录"，不会瞎编。</div>'
      +'<div style="margin-top:14px; display:grid; grid-template-columns:repeat(6,1fr); gap:8px; align-items:end;">'
      +'<div><label style="font-size:11.5px;color:var(--soft);">城市</label><input id="pfCity" placeholder="深圳市"></div>'
      +'<div><label style="font-size:11.5px;color:var(--soft);">区/县</label><input id="pfDistrict" placeholder="福田区"></div>'
      +'<div><label style="font-size:11.5px;color:var(--soft);">街道（选填）</label><input id="pfStreet" placeholder=""></div>'
      +'<div><label style="font-size:11.5px;color:var(--soft);">常住人口（万人）</label><input id="pfPop" type="number" step="any" placeholder="152.10"></div>'
      +'<div><label style="font-size:11.5px;color:var(--soft);">数据年份</label><input id="pfYear" type="number" placeholder="2023"></div>'
      +'<button class="btn" id="pfAdd">新增一条</button>'
      +'</div>'
      +'<div style="margin-top:6px;"><label style="font-size:11.5px;color:var(--soft);">数据来源（如：深圳市福田区2023年国民经济和社会发展统计公报）</label>'
      +'<input id="pfSource" style="width:100%;" placeholder="官方公报/统计年鉴的名称，方便以后核对"></div>'
      +'<div id="popBox" style="margin-top:16px;">加载中…</div></div>';
    document.getElementById("pfAdd").onclick = addPopulation;
    await refreshPopulation();
  };
  async function addPopulation(){
    const g=id=>document.getElementById(id).value.trim();
    const city=g("pfCity"), district=g("pfDistrict");
    const population=parseFloat(g("pfPop")), year=parseInt(g("pfYear"));
    if(!city||!district) return msg("请填写城市与区/县","err");
    if(!isFinite(population)||population<=0) return msg("常住人口请填正数","err");
    if(!isFinite(year)) return msg("请填写数据年份","err");
    const r=await fetch("/api/population",{method:"POST",headers:authHeaders(),
      body:JSON.stringify({city,district,street:g("pfStreet"),population,year,source:g("pfSource")})});
    const d=await r.json();
    if(!d.ok) return msg(d.error||"新增失败","err");
    msg("已新增","ok");
    ["pfCity","pfDistrict","pfStreet","pfPop","pfYear","pfSource"].forEach(id=>document.getElementById(id).value="");
    refreshPopulation();
  }
  async function refreshPopulation(){
    const el=document.getElementById("popBox"); if(!el) return;
    try{
      const r=await fetch("/api/population",{headers:authHeaders()});
      const d=await r.json();
      if(!d.ok){ el.textContent=d.error||"加载失败"; return; }
      const list=d.list||[];
      if(!list.length){ el.innerHTML='<div class="hint">（暂无数据，用上面的表单新增一条）</div>'; return; }
      let t='<table class="tbl"><tr><th>城市</th><th>区/县</th><th>街道</th><th>常住人口(万)</th><th>年份</th><th>来源</th><th>操作</th></tr>';
      list.forEach(it=>{
        t+='<tr><td>'+esc(it.city)+'</td><td>'+esc(it.district)+'</td><td>'+esc(it.street||"—")+'</td>'
          +'<td>'+it.population+'</td><td>'+it.year+'</td><td style="max-width:220px;">'+esc(it.source||"—")+'</td>'
          +'<td><button class="btn sm" data-delpop="'+it.id+'">删除</button></td></tr>';
      });
      el.innerHTML=t+'</table>';
      el.querySelectorAll("[data-delpop]").forEach(b=>b.onclick=async()=>{
        if(!confirm("确定删除这条人口数据？")) return;
        await fetch("/api/population?id="+b.dataset.delpop,{method:"DELETE",headers:authHeaders()});
        refreshPopulation();
      });
    }catch(e){ el.textContent="加载失败："+e.message; }
  }
}
</script>
<script>
/* AI PPT template approval console: kept separate from the legacy admin script to reduce coupling. */
async function pptTemplateAdminApi(body){
  const r=await fetch("/api/ppttemplates",{method:"POST",headers:authHeaders(),body:JSON.stringify(body)}),d=await r.json();
  if(!r.ok||!d.ok)throw new Error(d.error||"PPT模板操作失败");return d;
}
async function openPptTemplates(){
  const list=document.getElementById("listBox"),edit=document.getElementById("editBox");edit.style.display="none";list.style.display="block";
  list.innerHTML='<h1 style="font-size:18px;">PPT模板审核与发布</h1><div class="sub">用户上传的参考PPT只在本机解析并以草稿保存；管理员发布后才进入全员模板检索。原始PPT不直接暴露给其他用户，前台只读取已审核的页面角色、容量和视觉特征。</div><div class="bar"><button class="btn ghost" id="pptTplReload">刷新</button></div><div id="pptTplBody" class="empty">读取中…</div>';
  document.getElementById("pptTplReload").onclick=openPptTemplates;
  try{
    const d=await pptTemplateAdminApi({action:"adminList"}),items=d.items||[],statusName={draft:"草稿",pending:"待审核",published:"已发布",rejected:"已驳回"};
    document.getElementById("pptTplBody").innerHTML=items.length?items.map(x=>{const p=x.profile||{},pages=p.pages||[],roles=[...new Set(pages.map(v=>v.role).filter(Boolean))].slice(0,8);return '<div class="card" style="display:block;margin-top:10px;padding:15px 17px;"><div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start;"><div><b style="font-size:15px;">'+esc(x.name)+'</b><div class="hint" style="margin-top:5px;">用户 #'+esc(x.user_id)+'　·　'+(p.slideCount||pages.length||0)+' 页　·　v'+esc(x.version)+'　·　指纹 '+esc(String(x.fingerprint||"").slice(0,16))+'</div></div><span class="stat-badge '+(x.status==="published"?"ok":x.status==="pending"?"warn":"")+'">'+esc(statusName[x.status]||x.status)+'</span></div><div style="margin-top:10px;font-size:12px;color:var(--soft);">页面角色：'+esc(roles.join(" / ")||"尚未识别")+'<br>存储标识：'+esc(x.storage_key||"仅元数据")+'</div>'+(x.review_note?'<div class="msg warn" style="margin-top:9px;">审核意见：'+esc(x.review_note)+'</div>':'')+'<div style="display:flex;gap:7px;margin-top:11px;">'+(x.status!=="published"?'<button class="btn sm" data-ppt-publish="'+esc(x.id)+'">审核通过并发布</button>':'')+(x.status!=="rejected"?'<button class="btn sm red" data-ppt-reject="'+esc(x.id)+'">驳回</button>':'')+(x.status==="published"?'<button class="btn sm" data-ppt-return="'+esc(x.id)+'">撤回为草稿</button>':'')+'</div></div>';}).join(""):'<div class="empty">暂无用户参考PPT模板。</div>';
    document.querySelectorAll("[data-ppt-publish]").forEach(b=>b.onclick=async()=>{const note=prompt("审核说明（可选）","")||"";try{await pptTemplateAdminApi({action:"review",id:b.dataset.pptPublish,decision:"publish",note});msg("模板已发布，全员可在AI PPT中检索","ok");openPptTemplates();}catch(e){msg(e.message,"err");}});
    document.querySelectorAll("[data-ppt-reject]").forEach(b=>b.onclick=async()=>{const note=prompt("请填写驳回原因","");if(note===null||!note.trim())return;try{await pptTemplateAdminApi({action:"review",id:b.dataset.pptReject,decision:"reject",note});msg("模板已驳回","ok");openPptTemplates();}catch(e){msg(e.message,"err");}});
    document.querySelectorAll("[data-ppt-return]").forEach(b=>b.onclick=async()=>{if(!confirm("撤回后该模板将不再供全员使用，是否继续？"))return;try{await pptTemplateAdminApi({action:"review",id:b.dataset.pptReturn,decision:"draft",note:"管理员撤回为草稿"});msg("模板已撤回为草稿","ok");openPptTemplates();}catch(e){msg(e.message,"err");}});
  }catch(e){document.getElementById("pptTplBody").innerHTML='<div class="msg err">'+esc(e.message)+'</div>';}
}
const pptTemplateNav=document.getElementById("btnPptTemplates");
if(pptTemplateNav)pptTemplateNav.onclick=()=>{document.querySelectorAll(".nav-item").forEach(n=>n.classList.remove("active"));pptTemplateNav.classList.add("active");openPptTemplates();};
</script>
